[package]
name = "lumen-dioxus"
version = "0.1.0"
edition = "2024"
description = "Lumen UI components for Dioxus: web, desktop, and Dioxus Native (Blitz)."
license = "MIT"
repository = "https://github.com/santi020k/lumen"
homepage = "https://lumen.santi020k.com"
documentation = "https://docs.rs/lumen-dioxus"
readme = "README.md"
keywords = ["dioxus", "ui", "components", "design-system", "blitz"]
categories = ["gui", "web-programming"]
include = ["src/**", "assets/lumen.css", "examples/**", "tests/**", "README.md", "LICENSE"]

[dependencies]
dioxus = { version = "0.7.10", default-features = false, features = ["macro", "html", "signals", "hooks"] }

[dev-dependencies]
dioxus-ssr = "0.7.10"
serde_json = "1"
dioxus = { version = "0.7.10", default-features = false, features = ["macro", "html", "signals", "hooks", "launch"] }

[features]
# Builds the gallery example on Dioxus Native (Blitz). Off by default so `cargo test` stays fast.
native-example = ["dioxus/native"]

[[example]]
name = "gallery"
required-features = ["native-example"]

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
