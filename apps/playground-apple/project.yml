name: LumenApplePlayground
options:
  bundleIdPrefix: com.santi020k.lumen
  deploymentTarget:
    iOS: "16.0"
    macOS: "13.0"
packages:
  LumenUI:
    path: ../..
targets:
  LumenApplePlayground:
    type: application
    platform: iOS
    sources:
      - Sources/LumenApplePlayground
      - Supporting/Assets.xcassets
    dependencies:
      - package: LumenUI
        product: LumenUI
      - target: LumenWidgetPlayground
        embed: true
        codeSign: true
    settings:
      base:
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: BY4995HQ3J
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 1.0.0
        PRODUCT_BUNDLE_IDENTIFIER: com.santi020k.lumen.playground.apple
        SWIFT_VERSION: 6.0
        TARGETED_DEVICE_FAMILY: "1,2"
        VERSIONING_SYSTEM: apple-generic
    info:
      path: Supporting/Info.plist
      properties:
        CFBundleDisplayName: Lumen Playground
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  LumenMacPlayground:
    type: application
    platform: macOS
    sources:
      - Sources/LumenApplePlayground
      - Supporting/Assets.xcassets
    dependencies:
      - package: LumenUI
        product: LumenUI
    entitlements:
      path: Supporting/LumenMacPlayground.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: BY4995HQ3J
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 1.0.0
        PRODUCT_BUNDLE_IDENTIFIER: com.santi020k.lumen.playground.apple
        PRODUCT_NAME: Lumen Playground
        SWIFT_VERSION: 6.0
        VERSIONING_SYSTEM: apple-generic
    info:
      path: Supporting/MacInfo.plist
      properties:
        CFBundleDisplayName: Lumen Playground
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: Copyright © 2026 Santiago Molina. All rights reserved.

  LumenWidgetPlayground:
    type: app-extension
    platform: iOS
    sources:
      - Sources/LumenWidgetPlayground
    dependencies:
      - package: LumenUI
        product: LumenWidgetUI
    info:
      path: Supporting/WidgetInfo.plist
      properties:
        CFBundleDisplayName: Lumen Widget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: BY4995HQ3J
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 1.0.0
        PRODUCT_BUNDLE_IDENTIFIER: com.santi020k.lumen.playground.apple.widget
        SWIFT_VERSION: 6.0
        TARGETED_DEVICE_FAMILY: "1,2"
  LumenWatchPlayground:
    type: application
    platform: watchOS
    deploymentTarget: "9.0"
    sources:
      - Sources/LumenWatchPlayground
    dependencies:
      - package: LumenUI
        product: LumenUI
    settings:
      base:
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Lumen Watch
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        INFOPLIST_KEY_WKApplication: true
        INFOPLIST_KEY_WKWatchOnly: true
        MARKETING_VERSION: 1.0.0
        PRODUCT_BUNDLE_IDENTIFIER: com.santi020k.lumen.playground.watch
        SWIFT_VERSION: 6.0
        TARGETED_DEVICE_FAMILY: "4"
schemes:
  LumenApplePlayground:
    build:
      targets:
        LumenApplePlayground: all
    run:
      config: Debug
    archive:
      config: Release
  LumenMacPlayground:
    build:
      targets:
        LumenMacPlayground: all
    run:
      config: Debug
    archive:
      config: Release
  LumenWatchPlayground:
    build:
      targets:
        LumenWatchPlayground: all
    run:
      config: Debug
    archive:
      config: Release
