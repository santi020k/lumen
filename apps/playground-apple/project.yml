name: LumenApplePlayground
options:
  bundleIdPrefix: com.santi020k.lumen
  deploymentTarget:
    iOS: "16.0"
packages:
  LumenUI:
    path: ../..
targets:
  LumenApplePlayground:
    type: application
    platform: iOS
    sources:
      - Sources/LumenApplePlayground
      - Supporting/Assets.xcassets
    dependencies:
      - package: LumenUI
        product: LumenUI
    settings:
      base:
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: BY4995HQ3J
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 1.0.0
        PRODUCT_BUNDLE_IDENTIFIER: com.santi020k.lumen.playground.apple
        SWIFT_VERSION: 6.0
        TARGETED_DEVICE_FAMILY: "1,2"
        VERSIONING_SYSTEM: apple-generic
    info:
      path: Supporting/Info.plist
      properties:
        CFBundleDisplayName: Lumen Playground
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  LumenWatchPlayground:
    type: application
    platform: watchOS
    deploymentTarget: "9.0"
    sources:
      - Sources/LumenWatchPlayground
    dependencies:
      - package: LumenUI
        product: LumenUI
    settings:
      base:
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Lumen Watch
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        INFOPLIST_KEY_WKApplication: true
        INFOPLIST_KEY_WKWatchOnly: true
        MARKETING_VERSION: 1.0.0
        PRODUCT_BUNDLE_IDENTIFIER: com.santi020k.lumen.playground.watch
        SWIFT_VERSION: 6.0
        TARGETED_DEVICE_FAMILY: "4"
schemes:
  LumenApplePlayground:
    build:
      targets:
        LumenApplePlayground: all
    run:
      config: Debug
    archive:
      config: Release
  LumenWatchPlayground:
    build:
      targets:
        LumenWatchPlayground: all
    run:
      config: Debug
    archive:
      config: Release
