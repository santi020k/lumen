<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 318 80" role="img" aria-labelledby="title desc">
  <title id="title">Lumen UI</title>
  <desc id="desc">A Lumen UI wordmark with layered glassmorphism interface panes.</desc>
  <defs>
    <linearGradient id="bg" x1="9" x2="56" y1="14" y2="69">
      <stop stop-color="#10172c" />
      <stop offset="0.52" stop-color="#0d2235" />
      <stop offset="1" stop-color="#080b1a" />
    </linearGradient>
    <radialGradient id="cyan" cx="23%" cy="18%" r="62%">
      <stop stop-color="#38bdf8" stop-opacity="0.78" />
      <stop offset="0.52" stop-color="#2dd4bf" stop-opacity="0.24" />
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="violet" cx="78%" cy="84%" r="70%">
      <stop stop-color="#a78bfa" stop-opacity="0.42" />
      <stop offset="0.62" stop-color="#a78bfa" stop-opacity="0.12" />
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="back" x1="17" x2="45" y1="19" y2="55">
      <stop stop-color="#f8fafc" stop-opacity="0.34" />
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0.12" />
    </linearGradient>
    <linearGradient id="mid" x1="11" x2="48" y1="25" y2="57">
      <stop stop-color="#7dd3fc" stop-opacity="0.4" />
      <stop offset="0.48" stop-color="#f8fafc" stop-opacity="0.22" />
      <stop offset="1" stop-color="#c4b5fd" stop-opacity="0.18" />
    </linearGradient>
    <linearGradient id="front" x1="20" x2="52" y1="27" y2="59">
      <stop stop-color="#f8fafc" stop-opacity="0.6" />
      <stop offset="0.46" stop-color="#cffafe" stop-opacity="0.34" />
      <stop offset="1" stop-color="#5eead4" stop-opacity="0.18" />
    </linearGradient>
    <linearGradient id="stroke" x1="12" x2="55" y1="18" y2="63">
      <stop stop-color="#f8fafc" stop-opacity="0.82" />
      <stop offset="0.5" stop-color="#bae6fd" stop-opacity="0.46" />
      <stop offset="1" stop-color="#ddd6fe" stop-opacity="0.28" />
    </linearGradient>
    <linearGradient id="shine" x1="22" x2="51" y1="32" y2="53">
      <stop stop-color="#f8fafc" stop-opacity="0.95" />
      <stop offset="0.52" stop-color="#cffafe" stop-opacity="0.74" />
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0.72" />
    </linearGradient>
    <linearGradient id="ui" x1="224" x2="262" y1="27" y2="52">
      <stop stop-color="#0ea5e9" />
      <stop offset="0.48" stop-color="#14b8a6" />
      <stop offset="1" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="shadow" x="-24%" y="-24%" width="148%" height="156%">
      <feDropShadow dx="0" dy="7" flood-color="#020617" flood-opacity="0.34" stdDeviation="5" />
    </filter>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur in="SourceGraphic" result="blur" stdDeviation="2.4" />
      <feColorMatrix
        in="blur"
        result="glow"
        type="matrix"
        values="0 0 0 0 0.2  0 0 0 0 0.9  0 0 0 0 0.95  0 0 0 0.72 0"
      />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect x="4" y="8" width="64" height="64" rx="16" fill="url(#bg)" />
  <rect x="4" y="8" width="64" height="64" rx="16" fill="url(#cyan)" />
  <rect x="4" y="8" width="64" height="64" rx="16" fill="url(#violet)" />
  <rect x="8.5" y="12.5" width="55" height="55" rx="13.5" fill="none" stroke="#f8fafc" stroke-opacity="0.13" />
  <g filter="url(#shadow)">
    <rect x="21.2" y="18.4" width="31" height="38" rx="9" fill="url(#back)" stroke="url(#stroke)" stroke-opacity="0.54" transform="rotate(-9 36.7 37.4)" />
    <rect x="14.3" y="25.2" width="37" height="33" rx="10" fill="url(#mid)" stroke="url(#stroke)" stroke-opacity="0.66" transform="rotate(5 32.8 41.7)" />
    <rect x="22.2" y="28.2" width="36" height="29.5" rx="9.5" fill="url(#front)" stroke="url(#stroke)" stroke-width="1.15" />
  </g>
  <path d="M28 35.2h14.7" fill="none" stroke="url(#shine)" stroke-linecap="round" stroke-width="2.2" />
  <path d="M28 42.2h23.2M28 49.2h12.3" fill="none" stroke="#f8fafc" stroke-linecap="round" stroke-opacity="0.72" stroke-width="2.2" />
  <circle cx="49.8" cy="35.4" r="3.1" fill="#f59e0b" filter="url(#glow)" />
  <path d="m53.4 21.5 1.4 4.2 4.2 1.4-4.2 1.4-1.4 4.2-1.4-4.2-4.2-1.4 4.2-1.4Z" fill="#f8fafc" opacity="0.9" />
  <text
    x="88"
    y="51"
    fill="#0f172a"
    font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="34"
    font-weight="850"
    letter-spacing="0"
  >Lumen</text>
  <text
    x="213"
    y="51"
    fill="url(#ui)"
    font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="24"
    font-weight="800"
    letter-spacing="0"
  >UI</text>
</svg>
