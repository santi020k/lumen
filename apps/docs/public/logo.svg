<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 80" role="img" aria-labelledby="title desc">
  <title id="title">Lumen UI</title>
  <desc id="desc">A Lumen UI wordmark with a glassy light-facet icon.</desc>
  <defs>
    <linearGradient id="field" x1="12" x2="60" y1="8" y2="68">
      <stop stop-color="#0f172a" />
      <stop offset="0.48" stop-color="#0c2a3f" />
      <stop offset="1" stop-color="#06111f" />
    </linearGradient>
    <linearGradient id="aurora" x1="13" x2="57" y1="14" y2="60">
      <stop stop-color="#38bdf8" stop-opacity="0.62" />
      <stop offset="0.52" stop-color="#2dd4bf" stop-opacity="0.22" />
      <stop offset="1" stop-color="#0284c7" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="glass" x1="21" x2="57" y1="20" y2="61">
      <stop stop-color="#f8fafc" />
      <stop offset="0.48" stop-color="#dff7ff" />
      <stop offset="1" stop-color="#a7f3d0" />
    </linearGradient>
    <linearGradient id="beam" x1="33" x2="55" y1="48" y2="24">
      <stop stop-color="#2dd4bf" />
      <stop offset="0.56" stop-color="#e0f2fe" />
      <stop offset="1" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="lens" x1="47" x2="59" y1="22" y2="34">
      <stop stop-color="#fde68a" />
      <stop offset="0.52" stop-color="#f59e0b" />
      <stop offset="1" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="ui" x1="222" x2="258" y1="26" y2="52">
      <stop stop-color="#0ea5e9" />
      <stop offset="1" stop-color="#14b8a6" />
    </linearGradient>
    <filter id="shadow" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="4" flood-color="#020617" flood-opacity="0.3" stdDeviation="4" />
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" result="blur" stdDeviation="2.2" />
      <feColorMatrix
        in="blur"
        result="glow"
        type="matrix"
        values="1 0 0 0 0.15  0 1 0 0 0.78  0 0 1 0 0.82  0 0 0 0.72 0"
      />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect x="4" y="8" width="64" height="64" rx="15" fill="url(#field)" />
  <rect x="8" y="12" width="56" height="56" rx="13" fill="url(#aurora)" opacity="0.72" />
  <rect x="8.75" y="12.75" width="54.5" height="54.5" rx="12.25" fill="none" stroke="#f8fafc" stroke-opacity="0.16" stroke-width="1.5" />
  <g filter="url(#shadow)">
    <path
      d="M25.5 21.4v27.2c0 5.2 4.2 9.4 9.4 9.4h20"
      fill="none"
      stroke="url(#glass)"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="8.4"
    />
    <path
      d="M25.5 21.4v27.2c0 5.2 4.2 9.4 9.4 9.4h20"
      fill="none"
      stroke="#f8fafc"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="1.25"
      opacity="0.58"
    />
  </g>
  <path
    d="M33.5 50.6 51.6 32.5"
    fill="none"
    filter="url(#glow)"
    stroke="url(#beam)"
    stroke-linecap="round"
    stroke-width="5.4"
  />
  <path d="m52 25.3 6.5 6.5-6.5 6.5-6.5-6.5Z" fill="url(#lens)" filter="url(#glow)" />
  <path
    d="m49.2 31.8 2.8-2.8 2.8 2.8"
    fill="none"
    stroke="#fffbeb"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-width="1.1"
    opacity="0.78"
  />
  <text
    x="88"
    y="51"
    fill="#0f172a"
    font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="34"
    font-weight="850"
    letter-spacing="0"
  >Lumen</text>
  <text
    x="213"
    y="51"
    fill="url(#ui)"
    font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="24"
    font-weight="800"
    letter-spacing="0"
  >UI</text>
</svg>
