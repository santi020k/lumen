name: Release

# cspell:words mapfile mktemp

on:
  push:
    branches: [main]
    paths:
      - ".changeset/**"
  workflow_dispatch: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Create release PR or publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      actions: write
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@eec1701b98bcc0b76d36af288ee78a0369cd84cc # v1
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org

      - name: Resolve packages pending publication
        id: scope
        run: node scripts/release-scope.mjs --github-output

      - name: Verify approved release candidate
        run: node scripts/check-approved-release-revision.mjs

      - name: Verify graduated Lumen 2 release
        run: node scripts/check-graduated-release-revision.mjs

      - name: Validate shared release metadata
        if: steps.scope.outputs.has-packages == 'true'
        run: >-
          pnpm run check:release-manifest &&
          node scripts/check-lumen-2-contract.mjs &&
          pnpm run check:lumen-3-contract -- --require-approved

      - name: Validate web release contracts
        if: steps.scope.outputs.web == 'true'
        run: pnpm run check:web-consumer-evidence

      - name: Validate React Native release contracts
        if: steps.scope.outputs.react-native == 'true'
        run: >-
          pnpm run check:react-native-peer-docs &&
          pnpm run test:react-native-peer-docs &&
          pnpm run check:swift-version &&
          pnpm run check:native-consumer-evidence &&
          pnpm run check:native-stability-soak

      - name: Build and inspect packages pending publication
        if: steps.scope.outputs.has-packages == 'true'
        env:
          LUMEN_RELEASE_PACKAGES: ${{ steps.scope.outputs.packages }}
        run: >-
          pnpm run build:release-scope &&
          pnpm run check:security &&
          pnpm run check:publish-dry-run

      - name: Validate MCP release contracts
        if: steps.scope.outputs.mcp == 'true'
        run: pnpm run check:mcp-snapshot

      - name: Validate packed MCP release
        if: steps.scope.outputs.mcp-package == 'true'
        run: pnpm run check:mcp-package

      - name: Create release pull request or publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.CHANGESETS_TOKEN || github.token }}
          publish-script: pnpm run publish-packages
          version-script: pnpm run version-packages
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          create-github-releases: true
        env:
          HUSKY: 0
          LUMEN_RELEASE_PACKAGES: ${{ steps.scope.outputs.packages }}
          LUMEN_RELEASE_PREPARED: "true"
          NPM_CONFIG_PROVENANCE: "true"

      - name: Verify published npm package family
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs['published-packages'] }}
        run: |
          node scripts/check-published-package-family.mjs

          release_audit_directory="$(mktemp -d)"
          trap 'rm -rf "$release_audit_directory"' EXIT

          mapfile -t published_package_specs < <(
            jq -r '.[] | "\(.name)@\(.version)"' <<<"$PUBLISHED_PACKAGES"
          )

          (
            cd "$release_audit_directory"
            npm init --yes >/dev/null
            npm install \
              --ignore-scripts \
              --legacy-peer-deps \
              --no-audit \
              --no-fund \
              -- "${published_package_specs[@]}"
          )

          jq -r '.[] | [.name, .version] | @tsv' <<<"$PUBLISHED_PACKAGES" |
            while IFS=$'\t' read -r package_name package_version; do
              pnpm run check:npm-release-provenance -- \
                --package "$package_name" \
                --version "$package_version" \
                --revision "$GITHUB_SHA" \
                --lockfile "$release_audit_directory/package-lock.json"
            done

          jq -r '.[] | [.name, .version] | @tsv' <<<"$PUBLISHED_PACKAGES" |
            while IFS=$'\t' read -r package_name package_version; do
              registry_version="$(npm view "$package_name@$package_version" version)"
              if [[ "$registry_version" != "$package_version" ]]; then
                echo "$package_name expected $package_version but npm returned $registry_version" >&2
                exit 1
              fi
            done

      - name: Create repository version tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./packages/lumen/package.json').version")
          RELEASE_TAG="v${VERSION}"

          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            release_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          else
            release_commit="$GITHUB_SHA"
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release ${RELEASE_TAG} already exists; skipping."
            exit 0
          fi

          if ! registry_version="$(npm view "@santi020k/lumen@${VERSION}" version 2>/dev/null)"; then
            echo "@santi020k/lumen@${VERSION} is not published; skipping repository release."
            exit 0
          fi

          if [[ "$registry_version" != "$VERSION" ]]; then
            echo "@santi020k/lumen expected ${VERSION} but npm returned ${registry_version}." >&2
            exit 1
          fi

          repository_tag_audit_directory="$(mktemp -d)"
          trap 'rm -rf "$repository_tag_audit_directory"' EXIT

          (
            cd "$repository_tag_audit_directory"
            npm init --yes >/dev/null
            npm install \
              --ignore-scripts \
              --legacy-peer-deps \
              --no-audit \
              --no-fund \
              -- "@santi020k/lumen@${VERSION}"
          )

          pnpm run check:npm-release-provenance -- \
            --package "@santi020k/lumen" \
            --version "$VERSION" \
            --revision "$release_commit" \
            --lockfile "$repository_tag_audit_directory/package-lock.json"

          if ! git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" -m "Release ${RELEASE_TAG}"
            git push origin "$RELEASE_TAG"
          fi

          release_type_arguments=()
          if [[ "$VERSION" == *-* ]]; then
            release_type_arguments+=(--prerelease)
          fi

          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "Lumen ${VERSION}" \
            --generate-notes \
            "${release_type_arguments[@]}"

      - name: Create and launch Compose release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./packages/lumen/package.json').version")"

          if ! git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} is not published; skipping Compose release."
            exit 0
          fi

          git fetch --force origin "refs/tags/v${VERSION}:refs/tags/v${VERSION}"
          release_commit="$(git rev-list -n 1 "v${VERSION}")"

          if [[ "$release_commit" != "$GITHUB_SHA" ]]; then
            echo "Tag v${VERSION} belongs to ${release_commit}; no Compose release is pending at ${GITHUB_SHA}."
            exit 0
          fi

          COMPOSE_VERSION="$(sed -n 's/^lumenComposeVersion=//p' packages/compose/gradle.properties)"
          COMPOSE_TAG="compose-v${COMPOSE_VERSION}"

          if git ls-remote --exit-code --tags origin "refs/tags/${COMPOSE_TAG}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${COMPOSE_TAG}:refs/tags/${COMPOSE_TAG}"
            existing_commit="$(git rev-list -n 1 "$COMPOSE_TAG")"

            if [[ "$existing_commit" != "$GITHUB_SHA" ]]; then
              if git diff --quiet "$COMPOSE_TAG" "$GITHUB_SHA" -- packages/compose; then
                echo "Tag ${COMPOSE_TAG} contains the unchanged Compose source; checking publication status."
              else
                echo "Tag ${COMPOSE_TAG} already exists at ${existing_commit}, not ${GITHUB_SHA}." >&2
                exit 1
              fi
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$COMPOSE_TAG" -m "Release ${COMPOSE_TAG}"
            git push origin "$COMPOSE_TAG"
          fi

          active_or_successful_runs="$(
            gh run list \
              --workflow publish-compose.yml \
              --branch "$COMPOSE_TAG" \
              --limit 20 \
              --json status,conclusion \
              --jq '[.[] | select(.status != "completed" or .conclusion == "success")] | length'
          )"

          if [[ "$active_or_successful_runs" != "0" ]]; then
            echo "Compose publication already active or successful for ${COMPOSE_TAG}; skipping dispatch."
            exit 0
          fi

          # A tag pushed with GITHUB_TOKEN does not trigger another workflow run.
          gh workflow run publish-compose.yml \
            --ref "$COMPOSE_TAG" \
            --field publishing-type=AUTOMATIC
