name: Apple native checks
# cspell:words simctl ARCHS

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify Apple impact
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      swift: ${{ steps.scope.outputs.swift }}
      react-native: ${{ steps.scope.outputs.react-native }}
      captures: ${{ steps.scope.outputs.captures }}
      visual: ${{ steps.scope.outputs.visual }}
      framework-visual: ${{ steps.scope.outputs.framework-visual }}
      full: ${{ steps.scope.outputs.full }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
      - name: Resolve affected Apple surfaces
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: >-
          node scripts/classify-workflow-paths.mjs apple
          --base "$BASE_SHA" --head "$HEAD_SHA" --output "$GITHUB_OUTPUT"

  checks:
    name: Apple ${{ matrix.check }}
    needs: classify
    if: always() && github.event.repository.private == false
    # Keep every required check name present. Unaffected ordinary PR checks only
    # validate the plan on Linux; release and manual runs always select macOS.
    runs-on: ${{ needs.classify.outputs[matrix.check] == 'true' && 'macos-26' || 'ubuntu-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        check: [swift, react-native, visual, framework-visual]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      LUMEN_NATIVE_SETUP_READY: '1'
      LUMEN_PLAYWRIGHT_READY: '1'
    steps:
      - name: Require a valid Apple scope
        env:
          CLASSIFICATION_RESULT: ${{ needs.classify.result }}
          SELECTED: ${{ needs.classify.outputs[matrix.check] }}
          SCOPE_REASON: ${{ needs.classify.outputs.reason }}
        run: |
          test "$CLASSIFICATION_RESULT" = success
          case "$SELECTED" in
            true) echo "Running Apple gate ($SCOPE_REASON)." ;;
            false) echo "Apple gate is unaffected by these owned inputs." ;;
            *) echo "Missing or invalid Apple scope." >&2; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.classify.outputs[matrix.check] == 'true'
        with:
          fetch-depth: 1
      - name: Verify stable Apple toolchain
        if: needs.classify.outputs[matrix.check] == 'true'
        run: apps/playground-apple/scripts/check-app-store-toolchain.sh
      - uses: santi020k/quality/actions/setup-pnpm@ff490e9efbd5fdfbdb1e6c404f1741d04c57f585 # v2.0.0
        if: needs.classify.outputs[matrix.check] == 'true'
        with:
          node-version: 22.x
      - name: Restore Swift build cache
        if: needs.classify.outputs[matrix.check] == 'true' && matrix.check == 'swift'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: swift-${{ runner.os }}-${{ runner.arch }}-26.5-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: swift-${{ runner.os }}-${{ runner.arch }}-26.5-${{ hashFiles('Package.swift', 'Package.resolved') }}-
      - name: Restore playground Swift build cache
        if: needs.classify.outputs[matrix.check] == 'true' && matrix.check == 'swift'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/playground-apple/.build
          key: swift-playground-${{ runner.os }}-${{ runner.arch }}-26.5-${{ hashFiles('Package.swift', 'Package.resolved', 'apps/playground-apple/Package.swift', 'apps/playground-apple/Package.resolved') }}-${{ github.sha }}
          restore-keys: swift-playground-${{ runner.os }}-${{ runner.arch }}-26.5-${{ hashFiles('Package.swift', 'Package.resolved', 'apps/playground-apple/Package.swift', 'apps/playground-apple/Package.resolved') }}-
      - name: Set up cached browsers
        if: needs.classify.outputs[matrix.check] == 'true' && (matrix.check == 'visual' || matrix.check == 'framework-visual')
        uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium
      - name: Run equivalent Apple gate
        if: needs.classify.outputs[matrix.check] == 'true'
        run: apps/playground-apple/ci_scripts/run-native-checks.sh "${{ matrix.check }}"
      - name: Keep failure evidence
        if: failure() && needs.classify.outputs[matrix.check] == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple-${{ matrix.check }}-failure
          path: |
            test-results
            apps/docs/test-results
            apps/playground-apple/Screenshots
          retention-days: 3

  capture-build:
    name: Build native capture products
    needs: classify
    if: github.event.repository.private == false && needs.classify.outputs.captures == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - name: Verify stable Apple toolchain
        run: apps/playground-apple/scripts/check-app-store-toolchain.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
      - name: Build app and native Tour test bundle once
        run: |
          xcodebuild -project apps/playground-apple/LumenApplePlayground.xcodeproj \
            -scheme LumenApplePlaygroundPerformance -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/capture-build" \
            ARCHS="$(uname -m)" ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO build-for-testing
          node .github/scripts/apple-capture-products.mjs record "$RUNNER_TEMP/capture-build/Build/Products"
          tar -czf "$RUNNER_TEMP/capture-products.tar.gz" -C "$RUNNER_TEMP/capture-build/Build/Products" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple-capture-products
          path: ${{ runner.temp }}/capture-products.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  capture-shards:
    needs: [classify, capture-build]
    name: Apple capture group ${{ matrix.shard }}
    if: github.event.repository.private == false && needs.classify.outputs.captures == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - name: Verify stable Apple toolchain
        run: apps/playground-apple/scripts/check-app-store-toolchain.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apple-capture-products
          path: ${{ runner.temp }}/capture-download
      - name: Verify shared native products
        run: |
          mkdir -p "$RUNNER_TEMP/capture-products"
          tar -xzf "$RUNNER_TEMP/capture-download/capture-products.tar.gz" -C "$RUNNER_TEMP/capture-products"
          node .github/scripts/apple-capture-products.mjs verify "$RUNNER_TEMP/capture-products"
          echo "LUMEN_CAPTURE_PRODUCTS=$RUNNER_TEMP/capture-products" >> "$GITHUB_ENV"
      - name: Select native screenshot device
        run: |
          device_id="$(xcrun simctl create 'Lumen CI' com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro-Max com.apple.CoreSimulator.SimRuntime.iOS-26-5)"
          echo "LUMEN_SIMULATOR_UDID=$device_id" >> "$GITHUB_ENV"
      - name: Capture assigned native components
        env:
          CAPTURE_SHARD: ${{ matrix.shard }}
        run: |
          node .github/scripts/apple-capture-shard.mjs "$CAPTURE_SHARD" 4 > "$RUNNER_TEMP/components.txt"
          components=()
          while IFS= read -r component; do
            components+=("$component")
          done < "$RUNNER_TEMP/components.txt"
          CI_XCODE_CLOUD=1 apps/playground-apple/scripts/capture-component-screenshots.sh \
            apps/playground-apple/Screenshots "${components[@]}"
      - name: Upload native captures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple-captures-${{ matrix.shard }}
          path: apps/playground-apple/Screenshots/*.png
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Keep native capture failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple-capture-failure-${{ matrix.shard }}
          path: apps/playground-apple/Screenshots
          retention-days: 1

  captures:
    name: Apple captures
    needs: [classify, capture-build, capture-shards]
    if: always() && github.event.repository.private == false
    # Only PNG comparison runs here; all native builds and captures run on macOS.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require every selected native capture group
        env:
          CLASSIFICATION_RESULT: ${{ needs.classify.result }}
          SELECTED: ${{ needs.classify.outputs.captures }}
          BUILD_RESULT: ${{ needs.capture-build.result }}
          CAPTURE_RESULT: ${{ needs.capture-shards.result }}
        run: |
          test "$CLASSIFICATION_RESULT" = success
          case "$SELECTED" in
            true)
              test "$BUILD_RESULT" = success
              test "$CAPTURE_RESULT" = success
              ;;
            false)
              test "$BUILD_RESULT" = skipped
              test "$CAPTURE_RESULT" = skipped
              echo "Native captures are unaffected by these owned inputs."
              ;;
            *) echo "Missing or invalid native capture scope." >&2; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.classify.outputs.captures == 'true'
        with:
          fetch-depth: 1
      - uses: santi020k/quality/actions/setup-pnpm@ff490e9efbd5fdfbdb1e6c404f1741d04c57f585 # v2.0.0
        if: needs.classify.outputs.captures == 'true'
        with:
          node-version: 22.x
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.classify.outputs.captures == 'true'
        with:
          pattern: apple-captures-*
          merge-multiple: true
          path: apps/playground-apple/Screenshots
      - name: Compare the complete native catalog
        if: needs.classify.outputs.captures == 'true'
        run: |
          pnpm --filter @santi020k/lumen-docs exec node --experimental-strip-types \
            scripts/sync-native-component-captures.mjs \
            --compare --platform=apple --source=default --tolerance=0.12

  qualification:
    name: Apple full qualification
    needs: [classify, checks, captures]
    if: always() && github.event.repository.private == false && needs.classify.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Apple surface before signing eligibility
        env:
          CLASSIFICATION_RESULT: ${{ needs.classify.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          CAPTURES_RESULT: ${{ needs.captures.result }}
          SWIFT_SELECTED: ${{ needs.classify.outputs.swift }}
          REACT_NATIVE_SELECTED: ${{ needs.classify.outputs.react-native }}
          CAPTURES_SELECTED: ${{ needs.classify.outputs.captures }}
          VISUAL_SELECTED: ${{ needs.classify.outputs.visual }}
          FRAMEWORK_VISUAL_SELECTED: ${{ needs.classify.outputs.framework-visual }}
        run: |
          test "$CLASSIFICATION_RESULT" = success
          test "$CHECKS_RESULT" = success
          test "$CAPTURES_RESULT" = success
          for selected in "$SWIFT_SELECTED" "$REACT_NATIVE_SELECTED" "$CAPTURES_SELECTED" "$VISUAL_SELECTED" "$FRAMEWORK_VISUAL_SELECTED"; do
            test "$selected" = true
          done
