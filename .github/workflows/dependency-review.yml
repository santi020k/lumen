name: Dependency Review

on:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "apps/*/package.json"
      - "packages/*/package.json"
      - ".github/workflows/dependency-review.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Review dependency changes
    if: "${{ !startsWith(github.head_ref, 'changeset-release/') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # Transitive React Native build dependency; neither advisory has a patched release yet.
          # Remove these exceptions when image-size publishes a fixed version.
          # cspell:disable-next-line -- GitHub advisory identifiers are machine-generated.
          allow-ghsas: GHSA-5p2g-fcmc-qvqq, GHSA-w3rx-r6r6-pgpr
