name: Launch Mac playground release

on:
  push:
    branches:
      - main
    paths:
      - apps/playground-apple/release.json
  workflow_dispatch:

concurrency:
  group: lumen-playground-mac-app-store-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  launch:
    name: Create Xcode Cloud macOS release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: app-store
      url: https://appstoreconnect.apple.com/apps/6805250815
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify macOS release request
        id: release
        shell: bash
        run: |
          set -euo pipefail

          node scripts/check-playground-apple-release.mjs
          release_version="$(node -p "require('./apps/playground-apple/release.json').version")"
          if [[ ! "$release_version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error title=Invalid version::Use a version such as 1.0 or 1.0.0."
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error title=Invalid release branch::Launch Mac App Store releases from main, not $GITHUB_REF_NAME."
            exit 1
          fi


          release_tag="playground-macos-v${release_version}-r${GITHUB_RUN_NUMBER}"
          if git ls-remote --exit-code --tags origin "refs/tags/$release_tag" >/dev/null 2>&1; then
            echo "::error title=Release already exists::$release_tag already exists and release tags are immutable."
            exit 1
          fi

          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Launch Xcode Cloud macOS release
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$RELEASE_TAG" --message "Launch Lumen Playground $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Write release summary
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          {
            echo "## macOS release launched"
            echo
            echo "Created \`$RELEASE_TAG\` at \`$GITHUB_SHA\`."
            echo "The Xcode Cloud Mac App Store Release workflow will validate, archive, sign, and upload the native Mac app to App Store Connect."
          } >> "$GITHUB_STEP_SUMMARY"

  monitor:
    name: Monitor Xcode Cloud macOS release
    needs: launch
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    environment:
      name: app-store
      url: https://appstoreconnect.apple.com/apps/6805250815
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out status monitor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Fetch Apple release-monitoring secrets from Infisical
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /playground/apple

      - name: Wait for Xcode Cloud
        env:
          XCODE_CLOUD_PRODUCT_ID: ${{ vars.XCODE_CLOUD_PRODUCT_ID }}
          XCODE_CLOUD_WORKFLOW_NAME: Mac App Store Release
          SOURCE_COMMIT_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.launch.outputs.release_tag }}
        run: APP_STORE_CONNECT_PRIVATE_KEY="$APP_STORE_CONNECT_API_KEY_P8" node .github/scripts/monitor-xcode-cloud.mjs
