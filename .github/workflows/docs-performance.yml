name: Docs Performance

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "packages/astro/**"
      - "packages/core/**"
      - "packages/lumen/styles.css"
      - "scripts/check-docs-performance.mjs"
      - ".github/workflows/docs-performance.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: docs-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Reuse the package and docs builds that CI already produced for identical inputs.
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - uses: santi020k/quality/actions/setup-pnpm@ff490e9efbd5fdfbdb1e6c404f1741d04c57f585 # v2.0.0
        with:
          node-version: 22.x
      - name: Bind task cache to the resolved runtime
        shell: bash
        run: |
          echo "QUALITY_TASK_RUNTIME=$(node --version)-$(pnpm --version)-$(node -p 'process.platform + "/" + process.arch')" >> "$GITHUB_ENV"
      - name: Set up cached Chromium
        uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium
      - name: Build docs
        run: pnpm run docs:build
      - name: Check mobile Lighthouse budgets
        run: pnpm run check:docs-performance
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-lighthouse
          path: apps/docs/.astro/lighthouse/*.json
          if-no-files-found: ignore
