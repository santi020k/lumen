name: Docs Performance

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "packages/astro/**"
      - "packages/core/**"
      - "packages/lumen/styles.css"
      - "scripts/check-docs-performance.mjs"
      - ".github/workflows/docs-performance.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: docs-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - uses: santi020k/quality/actions/setup-pnpm@ffa37774f75b2b8e761fe3d71e7046cdb6694a69 # v1
        with:
          node-version: 22.x
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Build docs
        run: pnpm run docs:build
      - name: Check mobile Lighthouse budgets
        run: pnpm run check:docs-performance
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-lighthouse
          path: apps/docs/.astro/lighthouse/*.json
          if-no-files-found: ignore
