# Managed by the santi020k PR title standard.
name: PR Title

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize, labeled, unlabeled]

permissions:
  pull-requests: read
  statuses: write

jobs:
  lint:
    name: Lint PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate Conventional Commit title
        shell: bash
        run: |
          node <<'NODE'
          const { readFileSync } = require('node:fs')

          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'))
          const labels = event.pull_request.labels.map(label => label.name)

          if (labels.includes('autorelease: pending')) process.exit(0)

          const title = event.pull_request.title
          const allowedTypes = [
            'build',
            'chore',
            'ci',
            'docs',
            'feat',
            'fix',
            'perf',
            'refactor',
            'revert',
            'style',
            'test'
          ].join('|')
          const match = new RegExp(`^(?:${allowedTypes})(?:\\([^)]+\\))?!?: (.+)$`).exec(title)

          if (!match) {
            console.error('PR title must use an allowed Conventional Commit type and optional scope.')
            console.error('Example: "feat: add repository-aware prompts"')
            process.exit(1)
          }

          if (/^[A-Z]/.test(match[1])) {
            console.error('The subject must start with a lowercase letter.')
            console.error('Example: "feat: add repository-aware prompts"')
            process.exit(1)
          }
          NODE
