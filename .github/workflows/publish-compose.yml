name: Publish Compose to Maven Central

on:
  push:
    tags:
      - compose-v*
  workflow_dispatch:
    inputs:
      publishing-type:
        description: Publish automatically after Central validation or hold for manual approval
        default: AUTOMATIC
        options:
          - USER_MANAGED
          - AUTOMATIC
        required: true
        type: choice

permissions:
  contents: read

concurrency:
  group: publish-compose-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and upload signed artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
      MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve and validate version
        env:
          REQUESTED_PUBLISHING_TYPE: ${{ inputs['publishing-type'] }}
        run: |
          LUMEN_COMPOSE_VERSION="$(sed -n 's/^lumenComposeVersion=//p' packages/compose/gradle.properties)"
          if [[ ! "$LUMEN_COMPOSE_VERSION" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "Invalid Maven version: $LUMEN_COMPOSE_VERSION" >&2
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tag_version="${GITHUB_REF_NAME#compose-v}"
            if [[ "$tag_version" != "$LUMEN_COMPOSE_VERSION" ]]; then
              echo "Tag version $tag_version does not match canonical Compose version $LUMEN_COMPOSE_VERSION." >&2
              exit 1
            fi
            PUBLISHING_TYPE="AUTOMATIC"
          else
            PUBLISHING_TYPE="$REQUESTED_PUBLISHING_TYPE"
          fi

          echo "LUMEN_COMPOSE_VERSION=$LUMEN_COMPOSE_VERSION" >> "$GITHUB_ENV"
          echo "PUBLISHING_TYPE=$PUBLISHING_TYPE" >> "$GITHUB_ENV"

      - name: Validate documentation version
        run: node scripts/sync-compose-version.mjs --check

      - name: Validate Wear API classifications
        run: node scripts/check-wear-api-classification.mjs

      - name: Enforce native stable release gates
        run: node scripts/check-native-stable-readiness.mjs

      - name: Validate publication credentials
        run: |
          for variable_name in \
            MAVEN_CENTRAL_USERNAME \
            MAVEN_CENTRAL_PASSWORD \
            MAVEN_SIGNING_KEY \
            MAVEN_SIGNING_PASSWORD; do
            if [[ -z "${!variable_name}" ]]; then
              echo "Missing required GitHub Actions secret: $variable_name" >&2
              exit 1
            fi
          done

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android platform
        run: |
          android_sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          "$android_sdk_root/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" \
            "build-tools;36.0.0"

      - name: Build Central Portal bundle
        working-directory: packages/compose
        run: ./gradlew clean test lint apiCheck centralPortalBundle

      - name: Upload to Maven Central
        id: upload
        run: |
          bundle_path="$(find packages/compose/build/central-bundle -name '*.zip' -type f -print -quit)"
          if [[ -z "$bundle_path" ]]; then
            echo "The Maven Central bundle was not generated." >&2
            exit 1
          fi

          central_auth="$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 | tr -d '\n')"
          echo "::add-mask::$central_auth"
          deployment_id="$(curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $central_auth" \
            --form "bundle=@$bundle_path;type=application/octet-stream" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=lumen-compose-$LUMEN_COMPOSE_VERSION&publishingType=$PUBLISHING_TYPE")"

          echo "deployment-id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "Uploaded Maven Central deployment \`$deployment_id\` using \`$PUBLISHING_TYPE\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for Maven Central validation
        env:
          DEPLOYMENT_ID: ${{ steps.upload.outputs.deployment-id }}
        run: |
          central_auth="$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 | tr -d '\n')"
          echo "::add-mask::$central_auth"

          for _ in {1..90}; do
            response="$(curl --fail --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $central_auth" \
              "https://central.sonatype.com/api/v1/publisher/status?id=$DEPLOYMENT_ID")"
            deployment_state="$(jq --raw-output '.deploymentState' <<< "$response")"

            case "$deployment_state" in
              FAILED)
                jq . <<< "$response" >&2
                exit 1
                ;;
              PUBLISHED)
                echo "Maven Central published deployment \`$DEPLOYMENT_ID\`." >> "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
              VALIDATED)
                if [[ "$PUBLISHING_TYPE" == "USER_MANAGED" ]]; then
                  echo "Maven Central validated deployment \`$DEPLOYMENT_ID\`." >> "$GITHUB_STEP_SUMMARY"
                  exit 0
                fi
                ;;
            esac

            sleep 10
          done

          echo "Timed out waiting for Maven Central deployment $DEPLOYMENT_ID." >&2
          exit 1

      - name: Record manual approval instructions
        if: github.event_name == 'workflow_dispatch' && inputs['publishing-type'] == 'USER_MANAGED'
        run: |
          echo "Validate and publish deployment \`${{ steps.upload.outputs.deployment-id }}\` in the Maven Central Portal." >> "$GITHUB_STEP_SUMMARY"
