name: Publish Compose to Maven Central

on:
  workflow_dispatch:
    inputs:
      version:
        description: Maven version to publish
        required: true
        type: string
      publishing-type:
        description: Publish automatically after Central validation or hold for manual approval
        default: USER_MANAGED
        options:
          - USER_MANAGED
          - AUTOMATIC
        required: true
        type: choice

permissions:
  contents: read

concurrency:
  group: publish-compose-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and upload signed artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LUMEN_COMPOSE_VERSION: ${{ inputs.version }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
      MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate version
        run: |
          if [[ ! "$LUMEN_COMPOSE_VERSION" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "Invalid Maven version: $LUMEN_COMPOSE_VERSION" >&2
            exit 1
          fi

      - name: Validate publication credentials
        run: |
          for variable_name in \
            MAVEN_CENTRAL_USERNAME \
            MAVEN_CENTRAL_PASSWORD \
            MAVEN_SIGNING_KEY \
            MAVEN_SIGNING_PASSWORD; do
            if [[ -z "${!variable_name}" ]]; then
              echo "Missing required GitHub Actions secret: $variable_name" >&2
              exit 1
            fi
          done

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android platform
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Build Central Portal bundle
        working-directory: packages/compose
        run: ./gradlew clean test lint centralPortalBundle

      - name: Upload to Maven Central
        id: upload
        env:
          PUBLISHING_TYPE: ${{ inputs['publishing-type'] }}
        run: |
          bundle_path="$(find packages/compose/build/central-bundle -name '*.zip' -type f -print -quit)"
          if [[ -z "$bundle_path" ]]; then
            echo "The Maven Central bundle was not generated." >&2
            exit 1
          fi

          central_auth="$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 | tr -d '\n')"
          echo "::add-mask::$central_auth"
          deployment_id="$(curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $central_auth" \
            --form "bundle=@$bundle_path;type=application/octet-stream" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=lumen-compose-$LUMEN_COMPOSE_VERSION&publishingType=$PUBLISHING_TYPE")"

          echo "deployment-id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "Uploaded Maven Central deployment \`$deployment_id\` using \`$PUBLISHING_TYPE\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for Maven Central validation
        env:
          DEPLOYMENT_ID: ${{ steps.upload.outputs.deployment-id }}
          PUBLISHING_TYPE: ${{ inputs['publishing-type'] }}
        run: |
          central_auth="$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 | tr -d '\n')"
          echo "::add-mask::$central_auth"

          for _ in {1..90}; do
            response="$(curl --fail --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $central_auth" \
              "https://central.sonatype.com/api/v1/publisher/status?id=$DEPLOYMENT_ID")"
            deployment_state="$(jq --raw-output '.deploymentState' <<< "$response")"

            case "$deployment_state" in
              FAILED)
                jq . <<< "$response" >&2
                exit 1
                ;;
              PUBLISHED)
                echo "Maven Central published deployment \`$DEPLOYMENT_ID\`." >> "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
              VALIDATED)
                if [[ "$PUBLISHING_TYPE" == "USER_MANAGED" ]]; then
                  echo "Maven Central validated deployment \`$DEPLOYMENT_ID\`." >> "$GITHUB_STEP_SUMMARY"
                  exit 0
                fi
                ;;
            esac

            sleep 10
          done

          echo "Timed out waiting for Maven Central deployment $DEPLOYMENT_ID." >&2
          exit 1

      - name: Record manual approval instructions
        if: inputs['publishing-type'] == 'USER_MANAGED'
        run: |
          echo "Validate and publish deployment \`${{ steps.upload.outputs.deployment-id }}\` in the Maven Central Portal." >> "$GITHUB_STEP_SUMMARY"
