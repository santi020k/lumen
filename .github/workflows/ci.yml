name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      apple: ${{ steps.paths.outputs.apple }}
      android: ${{ steps.paths.outputs.android }}
      compatibility: ${{ steps.paths.outputs.compatibility }}
      dependencies: ${{ steps.paths.outputs.dependencies }}
      mcp: ${{ steps.paths.outputs.mcp }}
      native-contracts: ${{ steps.paths.outputs.native-contracts }}
      playwright: ${{ steps.paths.outputs.playwright }}
      react-native-captures: ${{ steps.paths.outputs.react-native-captures }}
      release-pr: ${{ steps.release.outputs.value }}
      skip-changelog: ${{ steps.release.outputs.skip-changelog }}
    steps:
      - name: Detect release pull request
        id: release
        env:
          IS_RELEASE_PR: "${{ startsWith(github.head_ref, 'changeset-release/') }}"
          SKIP_CHANGELOG: >-
            ${{
              contains(github.event.pull_request.labels.*.name, 'skip-changelog') ||
              startsWith(github.head_ref, 'changeset-release/') ||
              startsWith(github.head_ref, 'chore/') ||
              startsWith(github.head_ref, 'ci/') ||
              startsWith(github.head_ref, 'docs/') ||
              startsWith(github.head_ref, 'renovate/') ||
              startsWith(github.head_ref, 'dependabot/')
            }}
        run: |
          echo "value=$IS_RELEASE_PR" >> "$GITHUB_OUTPUT"
          echo "skip-changelog=$SKIP_CHANGELOG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          if grep -Eq '^(apps/(next-smoke|templates)/|packages/(astro|core|elements|icons-brand|lumen|mcp|react|react-hook-form|react-native|templates|tokens)/|registry/|scripts/(check-bundle-size|check-framework-contracts|check-publish-dry-run|smoke-consumer-packages|sync-registry|validate-registry)\.mjs$|eslint\.config\.js$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|tsconfig[^/]*\.json$|turbo\.json$|vitest\.config\.ts$)' <<< "$changed_files"; then
            echo "compatibility=true" >> "$GITHUB_OUTPUT"
          else
            echo "compatibility=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^(packages/(astro|core|elements|lumen|mcp|react|tokens)/|tokens/|registry/lumen\.registry\.json$|llms\.txt$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|tsconfig[^/]*\.json$|turbo\.json$|vitest\.config\.ts$)' <<< "$changed_files"; then
            echo "mcp=true" >> "$GITHUB_OUTPUT"
          else
            echo "mcp=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^(apps/(docs|templates)/|packages/(astro|core|elements|icons-brand|lumen|react|react-hook-form|templates)/|tests/a11y/|tests/visual/|playwright(\.[^/]*)?\.config\.ts$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|turbo\.json$|\.github/workflows/ci\.yml$)' <<< "$changed_files"; then
            echo "playwright=true" >> "$GITHUB_OUTPUT"
          else
            echo "playwright=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^(apps/playground-react-native/|packages/(core|react-native|tokens)/|tokens/|apps/docs/(public/native-components/|scripts/sync-native-component-captures\.mjs|src/data/native-component-captures\.json)|scripts/generate-platform-tokens\.mjs$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|turbo\.json$|\.github/workflows/ci\.yml$)' <<< "$changed_files"; then
            echo "react-native-captures=true" >> "$GITHUB_OUTPUT"
          else
            echo "react-native-captures=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^(apps/playground-(android|apple|react-native)/|packages/(compose|core|react-native|swift|swift-widget|tokens)/|tokens/|registry/(compose-api-classification|native-api-baseline|native-consumer-evidence|native-device-evidence|native-stability-soak|swift-api-baseline|swift-widget-api-baseline|wear-api-classification)\.json$|apps/docs/(public/native-components/|scripts/sync-native-component-captures\.mjs|src/data/native-component-captures\.json)|scripts/(check-compose-api-classification|check-native-consumer-evidence|check-native-device-evidence|check-native-stability-soak|check-wear-api-classification|check-(native|swift)-api-baseline|generate-platform-tokens)\.mjs$|Package\.swift$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.github/workflows/(ci|publish-compose)\.yml$)' <<< "$changed_files"; then
            echo "native-contracts=true" >> "$GITHUB_OUTPUT"
          else
            echo "native-contracts=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^(apps/playground-apple/|packages/(swift|swift-widget|tokens)/|tokens/|registry/(native-api-baseline|native-device-evidence|native-stability-soak|swift-api-baseline|swift-widget-api-baseline)\.json$|apps/docs/(public/native-components/|scripts/sync-native-component-captures\.mjs|src/data/native-component-captures\.json)|scripts/(check-native-device-evidence|check-native-stability-soak|check-(native|swift)-api-baseline|generate-platform-tokens)\.mjs$|Package\.swift$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.github/workflows/ci\.yml$)' <<< "$changed_files"; then
            echo "apple=true" >> "$GITHUB_OUTPUT"
          else
            echo "apple=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^(apps/playground-android/|packages/(compose|tokens)/|tokens/|registry/(compose-api-classification|native-api-baseline|native-device-evidence|native-stability-soak|wear-api-classification)\.json$|apps/docs/(public/native-components/|scripts/sync-native-component-captures\.mjs|src/data/native-component-captures\.json)|scripts/(check-compose-api-classification|check-native-device-evidence|check-native-stability-soak|check-wear-api-classification|check-native-api-baseline|generate-platform-tokens)\.mjs$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.github/workflows/(ci|publish-compose)\.yml$)' <<< "$changed_files"; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          else
            echo "android=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^(package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|apps/[^/]+/package\.json$|packages/[^/]+/package\.json$)' <<< "$changed_files"; then
            echo "dependencies=true" >> "$GITHUB_OUTPUT"
          else
            echo "dependencies=false" >> "$GITHUB_OUTPUT"
          fi

  native-apple:
    name: SwiftUI package
    needs: classify
    if: needs.classify.outputs.apple == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.2.0
        with:
          node-version: 22.x

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile Swift icon assets
        run: pnpm run check:swift-assets

      - name: Build and test LumenUI for macOS
        run: swift test

      - name: Check reviewed SwiftUI source compatibility against v1.6.0
        run: pnpm run check:swift-source-compatibility

      - name: Check every target-specific Swift public API
        run: pnpm run check:swift-api-baseline

      - name: Regenerate and compare iPhone component captures
        id: apple-captures
        continue-on-error: true
        env:
          CI: true
        run: |
          apps/playground-apple/scripts/capture-component-screenshots.sh
          pnpm --filter @santi020k/lumen-docs exec node --experimental-strip-types \
            scripts/sync-native-component-captures.mjs \
            --compare --platform=apple --source=default --tolerance=0.12

      - name: Upload Apple capture diagnostics
        if: steps.apple-captures.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apple-capture-diagnostics
          path: apps/playground-apple/Screenshots
          if-no-files-found: error

      - name: Fail on Apple capture regression
        if: steps.apple-captures.outcome == 'failure'
        run: exit 1

  native-android:
    name: Compose library
    needs: classify
    if: needs.classify.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.2.0
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Android platform
        run: |
          android_sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          "$android_sdk_root/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "emulator" \
            "system-images;android-35;google_apis;x86_64"

      - name: Build and test Compose library
        working-directory: packages/compose
        run: ./gradlew test lint apiCheck assembleDebugAndroidTest verifyMavenPublication

      - name: Check the Compose API classifications
        run: pnpm run check:compose-api-classification && pnpm run test:compose-api-classification

      - name: Check the Wear API classifications
        run: node scripts/check-wear-api-classification.mjs

      - name: Build a consumer from the candidate Compose artifact
        run: >-
          ./packages/compose/gradlew -p apps/playground-android
          -PlumenComposeRepository=../../packages/compose/build/central-staging
          assembleDebug :app:verifyLumenArtifactIsolation

      - name: Run Compose accessibility tests on Android
        working-directory: packages/compose
        run: |
          android_sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          adb="$android_sdk_root/platform-tools/adb"
          emulator="$android_sdk_root/emulator/emulator"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/lumen-avd"
          mkdir -p "$ANDROID_AVD_HOME"

          echo no | "$android_sdk_root/cmdline-tools/latest/bin/avdmanager" create avd \
            --force \
            --name lumen-ci \
            --path "$ANDROID_AVD_HOME/lumen-ci.avd" \
            --package "system-images;android-35;google_apis;x86_64"

          "$emulator" -list-avds | grep -Fx lumen-ci # cspell:ignore avds

          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
          fi

          "$emulator" -avd lumen-ci \
            -no-window \
            -no-audio \
            -no-snapshot-save \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            > "$RUNNER_TEMP/lumen-emulator.log" 2>&1 &
          emulator_pid=$!
          trap '"$adb" emu kill >/dev/null 2>&1 || kill "$emulator_pid" >/dev/null 2>&1 || true' EXIT

          if ! timeout 240 "$adb" wait-for-device; then
            cat "$RUNNER_TEMP/lumen-emulator.log" >&2
            exit 1
          fi
          booted=false
          for _ in {1..120}; do
            if [[ "$("$adb" shell getprop sys.boot_completed | tr -d '\r')" == "1" ]]; then
              booted=true
              break
            fi
            sleep 2
          done

          if [[ "$booted" != "true" ]]; then
            cat "$RUNNER_TEMP/lumen-emulator.log" >&2
            exit 1
          fi

          ./gradlew connectedDebugAndroidTest
          ./gradlew -p ../../apps/playground-android :app:assembleDebug :app:installDebug
          ../../apps/playground-android/scripts/capture-component-screenshots.sh \
            ../../apps/playground-android/build/screenshots
          pnpm --filter @santi020k/lumen-docs exec node --experimental-strip-types \
            scripts/sync-native-component-captures.mjs \
            --compare --platform=android --source=default --tolerance=0.12

  browser-contracts:
    name: Browser interaction contracts
    needs: classify
    if: needs.classify.outputs.release-pr != 'true' && needs.classify.outputs.playwright == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.2.0
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run cross-browser interaction contracts
        run: pnpm run test:interactions && pnpm run test:framework-conformance

      - name: Enforce web unit coverage
        run: pnpm run test:web-coverage

  react-native-captures:
    name: React Native captures
    needs: classify
    if: >-
      ${{
        needs.classify.outputs.release-pr != 'true' &&
        needs.classify.outputs.react-native-captures == 'true'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.2.0
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Regenerate and compare React Native component captures
        run: |
          pnpm --filter @santi020k/lumen-react-native... run build
          node scripts/prepare-packed-react-native-canary.mjs
          CI=1 pnpm --filter @santi020k/lumen-playground-react-native exec \
            expo start --web --port 8081 > "$RUNNER_TEMP/lumen-expo.log" 2>&1 &
          expo_pid=$!
          trap 'kill "$expo_pid" >/dev/null 2>&1 || true' EXIT
          for _ in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8081/ >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8081/ >/dev/null || {
            cat "$RUNNER_TEMP/lumen-expo.log" >&2
            exit 1
          }
          LUMEN_REQUIRE_PACKED=1 pnpm run playground:react-native:test:a11y
          pnpm run playground:react-native:capture
          pnpm --filter @santi020k/lumen-docs exec node --experimental-strip-types \
            scripts/sync-native-component-captures.mjs \
            --compare --platform=react-native --source=default --tolerance=0.04

  visual-regression:
    name: Visual regression
    needs: classify
    if: needs.classify.outputs.release-pr != 'true' && needs.classify.outputs.playwright == 'true'
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.2.0
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Run visual regression suite
        id: visual-regression
        continue-on-error: true
        run: pnpm run test:visual && pnpm run test:framework-visual

      - name: Upload visual regression diagnostics
        if: steps.visual-regression.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-regression-diagnostics
          path: test-results
          if-no-files-found: error

      - name: Fail on visual regression
        if: steps.visual-regression.outcome == 'failure'
        run: exit 1

  mcp-node-20:
    name: MCP compatibility (Node 20)
    needs: classify
    if: needs.classify.outputs.release-pr != 'true' && needs.classify.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.2.0
        with:
          node-version: 20.20.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and test the MCP package
        run: pnpm --filter @santi020k/lumen-mcp run build && pnpm --filter @santi020k/lumen-mcp run typecheck && pnpm --filter @santi020k/lumen-mcp run test

  build:
    name: Build and validate
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node-version: '${{ fromJSON((needs.classify.outputs.release-pr == ''true'' || needs.classify.outputs.compatibility != ''true'') && ''["22.x"]'' || ''["22.x","24.x"]'') }}'
    env:
      # cspell:ignore SYNCKIT
      SYNCKIT_TIMEOUT: 120000
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
      TURBO_SCM_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.2.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require a changeset
        if: >-
          ${{
            needs.classify.outputs.release-pr != 'true' &&
            matrix.node-version == '22.x' &&
            needs.classify.outputs.skip-changelog != 'true'
          }}
        run: pnpm changeset status --since=origin/main

      - name: Run CI checks
        if: needs.classify.outputs.release-pr != 'true'
        run: pnpm exec turbo run build typecheck lint test --affected

      - name: Assert the generated MCP snapshot is committed
        if: >-
          ${{
            needs.classify.outputs.release-pr != 'true' &&
            needs.classify.outputs.mcp == 'true' &&
            matrix.node-version == '22.x'
          }}
        run: git diff --exit-code -- packages/mcp/data/lumen-data.json

      - name: Run MCP quality evaluations
        if: >-
          ${{
            needs.classify.outputs.release-pr != 'true' &&
            needs.classify.outputs.mcp == 'true' &&
            matrix.node-version == '22.x'
          }}
        run: pnpm run check:mcp-evaluation

      - name: Install Playwright Chromium
        if: >-
          ${{
            needs.classify.outputs.release-pr != 'true' &&
            needs.classify.outputs.playwright == 'true' &&
            matrix.node-version == '22.x'
          }}
        run: pnpm exec playwright install --with-deps chromium

      - name: Run accessibility checks
        if: >-
          ${{
            needs.classify.outputs.release-pr != 'true' &&
            needs.classify.outputs.playwright == 'true' &&
            matrix.node-version == '22.x'
          }}
        run: pnpm run test:a11y

      - name: Repository checks
        if: needs.classify.outputs.release-pr != 'true' && matrix.node-version == '22.x'
        run: |
          node scripts/check-affected-files.mjs

          if [[ "${{ needs.classify.outputs.compatibility }}" == "true" ]]; then
            pnpm exec turbo run //#lint:knip //#check:registry
            pnpm run build
            pnpm run check:bundle-size
            pnpm run check:framework-contracts
            pnpm run check:publish-dry-run
            pnpm run check:consumer-packages
          fi

          if [[ "${{ needs.classify.outputs.native-contracts }}" == "true" ]]; then
            pnpm run check:native-contracts
            pnpm run check:native-captures
            pnpm run check:native-consumer-evidence
            pnpm run test:native-consumer-evidence
            pnpm run check:platform-tokens
          fi

          if [[ "${{ needs.classify.outputs.dependencies }}" == "true" ]]; then
            pnpm run check:security
          fi

      - name: Validate release packages
        if: needs.classify.outputs.release-pr == 'true'
        run: pnpm run build && pnpm run check:security && pnpm run check:publish-dry-run
