# cspell:words endgroup
name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify pull request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      android: ${{ steps.paths.outputs.android }}
      bundle-size: ${{ steps.paths.outputs.bundle-size }}
      compatibility: ${{ steps.paths.outputs.compatibility }}
      consumer-packages: ${{ steps.paths.outputs.consumer-packages }}
      dependencies: ${{ steps.paths.outputs.dependencies }}
      framework-contracts: ${{ steps.paths.outputs.framework-contracts }}
      mcp: ${{ steps.paths.outputs.mcp }}
      native-contracts: ${{ steps.paths.outputs.native-contracts }}
      npm-packages: ${{ steps.paths.outputs.npm-packages }}
      playwright: ${{ steps.paths.outputs.playwright }}
      react-native-captures: ${{ steps.paths.outputs.react-native-captures }}
      release-pr: ${{ steps.release.outputs.value }}
      skip-changelog: ${{ steps.release.outputs.skip-changelog }}
    steps:
      - name: Detect release pull request
        id: release
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          SKIP_CHANGELOG_REQUESTED: >-
            ${{
              contains(github.event.pull_request.labels.*.name, 'skip-changelog') ||
              startsWith(github.head_ref, 'chore/') ||
              startsWith(github.head_ref, 'ci/') ||
              startsWith(github.head_ref, 'docs/') ||
              startsWith(github.head_ref, 'renovate/') ||
              startsWith(github.head_ref, 'dependabot/')
            }}
        run: |
          is_release_pr=false
          release_pattern='^release/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)))*))?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'

          if [[ "$HEAD_REPOSITORY" == "$REPOSITORY" ]] &&
            { [[ "$HEAD_REF" == changeset-release/* ]] || [[ "$HEAD_REF" =~ $release_pattern ]]; }; then
            is_release_pr=true
          fi

          skip_changelog="$SKIP_CHANGELOG_REQUESTED"
          if [[ "$is_release_pr" == "true" ]]; then
            skip_changelog=true
          fi

          echo "value=$is_release_pr" >> "$GITHUB_OUTPUT"
          echo "skip-changelog=$skip_changelog" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0
          # Path classification reads commit history and this script only: skip file
          # contents for the history and check out just the classifier.
          filter: blob:none
          sparse-checkout: scripts

      - name: Classify changed paths
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          IS_RELEASE_PR: ${{ steps.release.outputs.value }}
        run: >-
          node scripts/classify-workflow-paths.mjs ci
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --output "$GITHUB_OUTPUT"

  preflight:
    name: Fast repository checks
    needs: classify
    uses: santi020k/quality/.github/workflows/reusable-pnpm-ci.yml@ff490e9efbd5fdfbdb1e6c404f1741d04c57f585 # v2.0.0
    with:
      node-version: 22.x
      timeout-minutes: 10
      command: pnpm run ci:preflight

  native-android:
    name: Compose library
    needs: [classify, preflight]
    if: needs.classify.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            packages/compose/**/*.gradle*
            packages/compose/gradle/wrapper/gradle-wrapper.properties
            apps/playground-android/**/*.gradle*

      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@ff490e9efbd5fdfbdb1e6c404f1741d04c57f585 # v2.0.0
        with:
          node-version: 22.x

      - name: Install Android platform
        run: |
          android_sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          "$android_sdk_root/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" \
            "build-tools;36.0.0"

      - name: Build and test Compose library
        working-directory: packages/compose
        run: ./gradlew test lint apiCheck verifyMavenPublication

      - name: Check the Compose API classifications
        run: pnpm run check:compose-api-classification && pnpm run test:compose-api-classification

      - name: Check the Wear API classifications
        run: node scripts/check-wear-api-classification.mjs

      - name: Build a consumer from the candidate Compose artifact
        run: >-
          ./packages/compose/gradlew -p apps/playground-android
          -PlumenComposeRepository=../../packages/compose/build/central-staging
          assembleDebug :app:verifyLumenArtifactIsolation

  native-android-device:
    name: Compose device checks
    # Instrumentation and captures build from source, so they run beside the library gates.
    needs: [classify, preflight]
    if: needs.classify.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            packages/compose/**/*.gradle*
            packages/compose/gradle/wrapper/gradle-wrapper.properties
            apps/playground-android/**/*.gradle*

      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@ff490e9efbd5fdfbdb1e6c404f1741d04c57f585 # v2.0.0
        with:
          node-version: 22.x

      - name: Install Android platform
        run: |
          android_sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          "$android_sdk_root/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "emulator" \
            "system-images;android-35;google_apis;x86_64"

      - name: Run Compose accessibility tests on Android
        working-directory: packages/compose
        run: |
          android_sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          adb="$android_sdk_root/platform-tools/adb"
          emulator="$android_sdk_root/emulator/emulator"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/lumen-avd"
          mkdir -p "$ANDROID_AVD_HOME"

          echo no | "$android_sdk_root/cmdline-tools/latest/bin/avdmanager" create avd \
            --force \
            --name lumen-ci \
            --path "$ANDROID_AVD_HOME/lumen-ci.avd" \
            --package "system-images;android-35;google_apis;x86_64"

          "$emulator" -list-avds | grep -Fx lumen-ci # cspell:ignore avds

          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
          fi

          "$emulator" -avd lumen-ci \
            -no-window \
            -no-audio \
            -no-snapshot-save \
            -no-boot-anim \
            -gpu swiftshader_indirect \
            > "$RUNNER_TEMP/lumen-emulator.log" 2>&1 &
          emulator_pid=$!
          trap '"$adb" emu kill >/dev/null 2>&1 || kill "$emulator_pid" >/dev/null 2>&1 || true' EXIT

          if ! timeout 240 "$adb" wait-for-device; then
            cat "$RUNNER_TEMP/lumen-emulator.log" >&2
            exit 1
          fi
          booted=false
          for _ in {1..120}; do
            if [[ "$("$adb" shell getprop sys.boot_completed | tr -d '\r')" == "1" ]]; then
              booted=true
              break
            fi
            sleep 2
          done

          if [[ "$booted" != "true" ]]; then
            cat "$RUNNER_TEMP/lumen-emulator.log" >&2
            exit 1
          fi

          # Prepare the disposable emulator for real window input after boot.
          # cspell:words keyevent keyguard stayon
          "$adb" shell svc power stayon true
          "$adb" shell settings put system screen_off_timeout 2147483647
          "$adb" shell input keyevent 224
          "$adb" shell wm dismiss-keyguard
          "$adb" shell dumpsys power > "$RUNNER_TEMP/lumen-emulator-power.log"

          run_phase() {
            local label="$1"
            shift
            local started=$SECONDS
            echo "::group::$label"
            "$@"
            echo "$label completed in $(( SECONDS - started )) seconds"
            echo "::endgroup::"
          }
          run_phase 'Compose instrumentation' ./gradlew connectedDebugAndroidTest
          run_phase 'Android consumer install' ./gradlew -p ../../apps/playground-android :app:assembleDebug :app:installDebug
          run_phase 'Android component captures' ../../apps/playground-android/scripts/capture-component-screenshots.sh \
            ../../apps/playground-android/build/screenshots
          pnpm --filter @santi020k/lumen-docs exec node --experimental-strip-types \
            scripts/sync-native-component-captures.mjs \
            --compare --platform=android --source=default --tolerance=0.12

      - name: Preserve Compose Android test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-android-test-reports
          path: |
            packages/compose/build/reports/androidTests/
            packages/compose/build/outputs/androidTest-results/
            apps/playground-android/build/screenshots/
            ${{ runner.temp }}/lumen-emulator.log
            ${{ runner.temp }}/lumen-emulator-power.log
          if-no-files-found: ignore
          retention-days: 7

  browser-contracts:
    name: Browser interaction contracts (${{ matrix.lane }})
    needs: [classify, preflight]
    if: needs.classify.outputs.playwright == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # Independent suites run side by side; the interaction suite is split in two.
        lane: [interactions-1, interactions-2, frameworks, motion]
    env:
      # Reuse the package builds that the build job publishes for identical inputs.
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@ff490e9efbd5fdfbdb1e6c404f1741d04c57f585 # v2.0.0
        with:
          node-version: 22.x

      - name: Bind task cache to the resolved runtime
        shell: bash
        run: |
          echo "QUALITY_TASK_RUNTIME=$(node --version)-$(pnpm --version)-$(node -p 'process.platform + "/" + process.arch')" >> "$GITHUB_ENV"

      - name: Install Playwright browsers
        uses: ./.github/actions/setup-playwright
        with:
          browsers: ${{ matrix.lane == 'motion' && 'chromium webkit' || 'chromium firefox webkit' }}

      - name: Run cross-browser interaction contracts
        if: startsWith(matrix.lane, 'interactions-')
        env:
          SHARD: ${{ matrix.lane == 'interactions-1' && '1/2' || '2/2' }}
        run: pnpm run test:interactions --shard="$SHARD"

      - name: Run cross-browser framework contracts
        if: matrix.lane == 'frameworks'
        run: pnpm run test:framework-conformance && pnpm run test:figma-plugin

      - name: Check local motion previews
        if: matrix.lane == 'motion'
        # This lane starts cold; build the preview with its workspace dependencies first.
        run: pnpm exec turbo run build --filter=@santi020k/lumen-motion --concurrency=2 && pnpm --filter @santi020k/lumen-motion test

      - name: Verify primitive motion and reduced-motion behavior
        if: matrix.lane == 'motion'
        run: pnpm run test:motion && pnpm run check:route-delivery

      - name: Measure packed selective subscribe forms
        if: matrix.lane == 'motion'
        run: pnpm run measure:subscribe-form

      - name: Enforce web unit coverage
        if: matrix.lane == 'motion'
        env:
          # This run owns the runner, unlike the suites Turbo schedules side by side.
          LUMEN_VITEST_MAX_WORKERS: 4
        run: pnpm run test:web-coverage

  react-native-captures:
    name: React Native captures
    needs: [classify, preflight]
    if: >-
      ${{
        needs.classify.outputs.react-native-captures == 'true'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@ff490e9efbd5fdfbdb1e6c404f1741d04c57f585 # v2.0.0
        with:
          node-version: 22.x

      - name: Install Playwright Chromium
        uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium

      - name: Build the React Native package
        run: pnpm --filter @santi020k/lumen-react-native... run build

      - name: Bundle the HarmonyOS playground
        # Runs before the packed canary replaces the playground's workspace packages.
        run: pnpm run check:harmony-bundle

      - name: Regenerate and compare React Native component captures
        run: |
          node scripts/prepare-packed-react-native-canary.mjs
          CI=1 pnpm --filter @santi020k/lumen-playground-react-native exec \
            expo start --web --port 8081 > "$RUNNER_TEMP/lumen-expo.log" 2>&1 &
          expo_pid=$!
          trap 'kill "$expo_pid" >/dev/null 2>&1 || true' EXIT
          for _ in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8081/ >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8081/ >/dev/null || {
            cat "$RUNNER_TEMP/lumen-expo.log" >&2
            exit 1
          }
          LUMEN_REQUIRE_PACKED=1 pnpm run playground:react-native:test:a11y
          pnpm run playground:react-native:capture
          pnpm --filter @santi020k/lumen-docs exec node --experimental-strip-types \
            scripts/sync-native-component-captures.mjs \
            --compare --platform=react-native --source=default --tolerance=0.04

      - name: Upload React Native captures on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: react-native-captures
          path: |
            test-results/react-native-components
            ${{ runner.temp }}/lumen-expo.log
          if-no-files-found: error

  mcp-node-20:
    name: MCP compatibility (Node 20)
    needs: [classify, preflight]
    if: needs.classify.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@ff490e9efbd5fdfbdb1e6c404f1741d04c57f585 # v2.0.0
        with:
          node-version: 20.20.x

      - name: Build and test the MCP package
        run: pnpm --filter @santi020k/lumen-mcp run build && pnpm --filter @santi020k/lumen-mcp run typecheck && pnpm --filter @santi020k/lumen-mcp run test

  build:
    name: Build and validate
    needs: [classify, preflight]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node-version: '${{ fromJSON(needs.classify.outputs.compatibility != ''true'' && ''["22.x"]'' || ''["22.x","24.x"]'') }}'
    env:
      # cspell:ignore SYNCKIT
      SYNCKIT_TIMEOUT: 120000
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
      TURBO_SCM_HEAD: ${{ github.event.pull_request.head.sha }}
      LUMEN_RELEASE_PACKAGES: ${{ needs.classify.outputs.npm-packages }}
    steps:
      - name: Require successful preflight
        env:
          CLASSIFICATION_RESULT: ${{ needs.classify.result }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
        run: |
          if [[ "$CLASSIFICATION_RESULT" != "success" || "$PREFLIGHT_RESULT" != "success" ]]; then
            echo "::error::Classification or preflight failed; expensive checks were not started."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0
          # History is needed for merge-base comparisons, not for old file contents.
          filter: blob:none

      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@ff490e9efbd5fdfbdb1e6c404f1741d04c57f585 # v2.0.0
        with:
          node-version: ${{ matrix.node-version }}
          task-cache-path: .turbo/cache
          task-cache-key: ci-build

      - name: Bind task cache to the resolved runtime
        shell: bash
        run: |
          echo "QUALITY_TASK_RUNTIME=$(node --version)-$(pnpm --version)-$(node -p 'process.platform + "/" + process.arch')" >> "$GITHUB_ENV"

      - name: Resolve release pull request scope
        id: release-scope
        if: needs.classify.outputs.release-pr == 'true'
        run: node scripts/release-scope.mjs --github-output

      - name: Require a changeset
        if: >-
          ${{
            needs.classify.outputs.release-pr != 'true' &&
            matrix.node-version == '22.x' &&
            needs.classify.outputs.skip-changelog != 'true'
          }}
        run: pnpm changeset status --since=origin/main

      - name: Install Chromium for affected package tests
        # Affected workspace tests include the motion app's browser suite.
        # Browser binaries must exist before Turbo starts those package tests.
        uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium

      - name: Run CI checks
        # Each Vitest suite already uses two workers; avoid oversubscribing the runner.
        env:
          IS_RELEASE_PR: ${{ needs.classify.outputs.release-pr }}
          NODE_LINE: ${{ matrix.node-version }}
        run: |
          scope=()
          if [[ "$IS_RELEASE_PR" != "true" ]]; then
            scope+=(--affected)
          fi
          # Type checking and linting do not depend on the runtime: the primary Node line
          # runs the full set and the compatibility line proves the build and tests.
          tasks=(build typecheck lint test)
          if [[ "$NODE_LINE" != "22.x" ]]; then
            tasks=(build test)
          fi
          pnpm exec turbo run "${tasks[@]}" "${scope[@]}" --concurrency=50%

      - name: Validate portable AI plugin and migration artifacts
        run: pnpm run check:plugin-package && pnpm run test:plugin-package && pnpm run check:v4-migration
      - name: Assert the generated MCP snapshot is committed
        if: >-
          ${{
            needs.classify.outputs.release-pr != 'true' &&
            needs.classify.outputs.mcp == 'true' &&
            matrix.node-version == '22.x'
          }}
        run: git diff --exit-code -- packages/mcp/data/lumen-data.json

      - name: Run MCP quality evaluations
        if: >-
          ${{
            needs.classify.outputs.release-pr != 'true' &&
            needs.classify.outputs.mcp == 'true' &&
            matrix.node-version == '22.x'
          }}
        run: pnpm run check:mcp-evaluation

      - name: Run accessibility checks
        if: >-
          ${{
            needs.classify.outputs.release-pr != 'true' &&
            needs.classify.outputs.playwright == 'true' &&
            matrix.node-version == '22.x'
          }}
        run: |
          pnpm run test:a11y
          pnpm run test:editorial --project=chromium
          pnpm run test:product-workflows --project=chromium
          pnpm run test:portable-editorial --project=chromium
          pnpm run test:rendered-audit --project=chromium

      - name: Repository checks
        if: needs.classify.outputs.release-pr != 'true' && matrix.node-version == '22.x'
        run: |
          node scripts/check-affected-files.mjs

          if [[ "${{ needs.classify.outputs.compatibility }}" == "true" ]]; then
            pnpm exec turbo run //#lint:knip //#check:registry
          fi

          if [[ "${{ needs.classify.outputs.bundle-size }}" == "true" || "${{ needs.classify.outputs.consumer-packages }}" == "true" ]]; then
            pnpm run build:release-scope
          fi

          if [[ "${{ needs.classify.outputs.bundle-size }}" == "true" ]]; then
            pnpm run check:bundle-size
          fi

          if [[ "${{ needs.classify.outputs.framework-contracts }}" == "true" ]]; then
            pnpm run check:framework-contracts
          fi

          if [[ "${{ needs.classify.outputs.npm-packages }}" != "[]" ]]; then
            pnpm run check:publish-dry-run
          fi

          if [[ "${{ needs.classify.outputs.consumer-packages }}" == "true" ]]; then
            pnpm run check:consumer-packages
          fi

          if [[ "${{ needs.classify.outputs.native-contracts }}" == "true" ]]; then
            pnpm run check:native-contracts
            pnpm run check:native-captures
            pnpm run check:platform-tokens
          fi

          if [[ "${{ needs.classify.outputs.dependencies }}" == "true" ]]; then
            pnpm run check:security
          fi

      - name: Validate release packages
        if: needs.classify.outputs.release-pr == 'true'
        env:
          LUMEN_RELEASE_PACKAGES: ${{ steps.release-scope.outputs.packages }}
        run: >-
          pnpm run build:release-scope &&
          pnpm run check:publish-dry-run
