name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-contracts:
    name: Browser interaction contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run cross-browser interaction contracts
        run: pnpm run test:interactions

  visual-regression:
    name: Visual regression
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Run visual regression suite
        run: pnpm run test:visual

  mcp-node-20:
    name: MCP compatibility (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 20.20.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and test the MCP package
        run: pnpm --filter @santi020k/lumen-mcp run build && pnpm --filter @santi020k/lumen-mcp run typecheck && pnpm --filter @santi020k/lumen-mcp run test

  build:
    name: Build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Turborepo cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ matrix.node-version }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ matrix.node-version }}-
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run CI checks
        run: pnpm exec turbo run build typecheck lint test

      - name: Assert the generated MCP snapshot is committed
        if: matrix.node-version == '22.x'
        run: git diff --exit-code -- packages/mcp/data/lumen-data.json

      - name: Run MCP quality evaluations
        if: matrix.node-version == '22.x'
        run: pnpm run check:mcp-evaluation

      - name: Install Playwright Chromium
        if: matrix.node-version == '22.x'
        run: pnpm exec playwright install --with-deps chromium

      - name: Run accessibility checks
        if: matrix.node-version == '22.x'
        run: pnpm run test:a11y

      - name: Repository checks
        if: matrix.node-version == '22.x'
        run: |
          pnpm exec turbo run //#lint:repo //#lint:spell //#lint:knip //#check:registry
          pnpm run check:bundle-size
          pnpm run check:framework-contracts
          pnpm run check:publish-dry-run
          pnpm run check:consumer-packages
