name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify pull request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.paths.outputs.native }}
      playwright: ${{ steps.paths.outputs.playwright }}
      release-pr: ${{ steps.release.outputs.value }}
    steps:
      - name: Detect release pull request
        id: release
        env:
          IS_RELEASE_PR: "${{ startsWith(github.head_ref, 'changeset-release/') }}"
        run: echo "value=$IS_RELEASE_PR" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect Playwright-related changes
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          if grep -Eq '^(apps/docs/|packages/|tests/a11y/|tests/visual/|playwright(\.[^/]*)?\.config\.ts$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|turbo\.json$|\.github/workflows/ci\.yml$)' <<< "$changed_files"; then
            echo "playwright=true" >> "$GITHUB_OUTPUT"
          else
            echo "playwright=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^(packages/(compose|react-native|swift|tokens)/|tokens/|scripts/generate-platform-tokens\.mjs$|Package\.swift$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.github/workflows/ci\.yml$)' <<< "$changed_files"; then
            echo "native=true" >> "$GITHUB_OUTPUT"
          else
            echo "native=false" >> "$GITHUB_OUTPUT"
          fi

  native-apple:
    name: SwiftUI package
    needs: classify
    if: needs.classify.outputs.native == 'true'
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Build and test LumenUI for macOS
        run: swift test

      - name: Build LumenUI for iOS
        run: >-
          xcodebuild -scheme LumenUI
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build

  native-android:
    name: Compose library
    needs: classify
    if: needs.classify.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
                - sdkmanager
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Build and test Compose library
        working-directory: packages/compose
        run: ./gradlew test lint

  browser-contracts:
    name: Browser interaction contracts
    needs: classify
    if: needs.classify.outputs.release-pr != 'true' && needs.classify.outputs.playwright == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run cross-browser interaction contracts
        run: pnpm run test:interactions

  visual-regression:
    name: Visual regression
    needs: classify
    if: needs.classify.outputs.release-pr != 'true' && needs.classify.outputs.playwright == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Run visual regression suite
        run: pnpm run test:visual

  mcp-node-20:
    name: MCP compatibility (Node 20)
    needs: classify
    if: needs.classify.outputs.release-pr != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: 20.20.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and test the MCP package
        run: pnpm --filter @santi020k/lumen-mcp run build && pnpm --filter @santi020k/lumen-mcp run typecheck && pnpm --filter @santi020k/lumen-mcp run test

  build:
    name: Build and validate
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node-version: '${{ fromJSON(needs.classify.outputs.release-pr == ''true'' && ''["22.x"]'' || ''["22.x","24.x"]'') }}'
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Turborepo cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ matrix.node-version }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ matrix.node-version }}-
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run CI checks
        if: needs.classify.outputs.release-pr != 'true'
        run: pnpm exec turbo run build typecheck lint test

      - name: Assert the generated MCP snapshot is committed
        if: needs.classify.outputs.release-pr != 'true' && matrix.node-version == '22.x'
        run: git diff --exit-code -- packages/mcp/data/lumen-data.json

      - name: Run MCP quality evaluations
        if: needs.classify.outputs.release-pr != 'true' && matrix.node-version == '22.x'
        run: pnpm run check:mcp-evaluation

      - name: Install Playwright Chromium
        if: needs.classify.outputs.release-pr != 'true' && matrix.node-version == '22.x'
        run: pnpm exec playwright install --with-deps chromium

      - name: Run accessibility checks
        if: needs.classify.outputs.release-pr != 'true' && matrix.node-version == '22.x'
        run: pnpm run test:a11y

      - name: Repository checks
        if: needs.classify.outputs.release-pr != 'true' && matrix.node-version == '22.x'
        run: |
          pnpm exec turbo run //#lint:repo //#lint:spell //#lint:knip //#check:registry
          pnpm run check:bundle-size
          pnpm run check:framework-contracts
          pnpm run check:native-contracts
          pnpm run check:platform-tokens
          pnpm run check:security
          pnpm run check:publish-dry-run
          pnpm run check:consumer-packages

      - name: Validate release packages
        if: needs.classify.outputs.release-pr == 'true'
        run: pnpm run build && pnpm run check:security && pnpm run check:publish-dry-run
