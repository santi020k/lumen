name: Check Mac playground release status

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing macOS release tag, for example playground-macos-v1.0.0-r42
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  monitor:
    name: Monitor Xcode Cloud macOS release
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    environment:
      name: app-store
      url: https://appstoreconnect.apple.com/apps/6805250815
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^playground-macos-v[0-9]+\.[0-9]+(\.[0-9]+)?-r[1-9][0-9]*$ ]]; then
            echo "::error title=Invalid tag::Use a macOS release tag such as playground-macos-v1.0.0-r42."
            exit 1
          fi
          if ! git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG^{commit}" >/dev/null; then
            echo "::error title=Unknown tag::$RELEASE_TAG does not exist in this repository."
            exit 1
          fi

          echo "commit_sha=$(git rev-list -n 1 "$RELEASE_TAG")" >> "$GITHUB_OUTPUT"

      - name: Fetch Apple release-monitoring secrets from Infisical
        uses: Infisical/secrets-action@6cd3f7c0e4cc0d2395ee4ef414eb6eeb5d3e73db # v1.0.17
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /playground/apple

      - name: Wait for Xcode Cloud
        env:
          XCODE_CLOUD_PRODUCT_ID: ${{ vars.XCODE_CLOUD_PRODUCT_ID }}
          XCODE_CLOUD_WORKFLOW_NAME: Mac App Store Release
          SOURCE_COMMIT_SHA: ${{ steps.release.outputs.commit_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: APP_STORE_CONNECT_PRIVATE_KEY="$APP_STORE_CONNECT_API_KEY_P8" node .github/scripts/monitor-xcode-cloud.mjs
