name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "apps/playground-react-native/**"
      - "packages/astro/**"
      - "packages/core/**"
      - "packages/elements/**"
      - "packages/icons-brand/**"
      - "packages/lumen/**"
      - "packages/react-native/**"
      - "packages/templates/**"
      - "packages/tokens/**"
      - ".github/workflows/deploy-docs.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
  workflow_dispatch: {}

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-docs-${{ github.ref }}
  cancel-in-progress: true

env:
  CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME || 'lumen' }}
  CLOUDFLARE_PAGES_PRODUCTION_BRANCH: ${{ vars.CLOUDFLARE_PAGES_PRODUCTION_BRANCH || 'main' }}
  DOCS_DIST_DIR: apps/docs/cloudflare/dist
  NODE_VERSION: 22.x
  PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://lumen.santi020k.com' }}

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main'
    name: Build and deploy docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@208015ed792b633a1455201ae2f3dd8d9b7eb96c # v1.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify release approval
        run: node scripts/check-approved-release-revision.mjs

      - name: Build docs
        run: pnpm run docs:build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          DEPLOY_BRANCH="${GITHUB_REF_NAME}"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            DEPLOY_BRANCH="$CLOUDFLARE_PAGES_PRODUCTION_BRANCH"
          fi

          pnpm exec wrangler pages deploy "$DOCS_DIST_DIR" --project-name="$CLOUDFLARE_PAGES_PROJECT_NAME" --branch="$DEPLOY_BRANCH"

      - name: Smoke test the public docs
        run: |
          for path in / /docs; do
            curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
              --max-time 20 --output /dev/null "${PUBLIC_SITE_URL%/}$path"
          done
