name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "apps/playground-react-native/**"
      - "examples/astro-starter/**"
      - "packages/astro/**"
      - "packages/core/**"
      - "packages/elements/**"
      - "packages/icons-brand/**"
      - "packages/lumen/**"
      - "packages/react-native/**"
      - "packages/templates/**"
      - "packages/tokens/**"
      - ".github/workflows/deploy-docs.yml"
      - ".github/scripts/docs-deployment-artifact.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
  workflow_dispatch: {}

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-docs-${{ github.ref }}
  cancel-in-progress: false

env:
  CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME || 'lumen' }}
  CLOUDFLARE_PAGES_PRODUCTION_BRANCH: ${{ vars.CLOUDFLARE_PAGES_PRODUCTION_BRANCH || 'main' }}
  DOCS_DIST_DIR: apps/docs/cloudflare/dist
  NODE_VERSION: 22.x
  PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://lumen.santi020k.com' }}

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    name: Build docs artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      archive-sha256: ${{ steps.archive.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up pnpm workspace
        uses: santi020k/quality/actions/setup-pnpm@ff490e9efbd5fdfbdb1e6c404f1741d04c57f585 # v2.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify release approval
        run: node scripts/check-approved-release-revision.mjs

      - name: Build docs
        run: pnpm run docs:build

      - name: Bind the built archive to this revision
        id: archive
        run: |
          test -s "$DOCS_DIST_DIR/index.html"
          tar -czf "$RUNNER_TEMP/docs.tar.gz" -C "$DOCS_DIST_DIR" .
          digest="$(node .github/scripts/docs-deployment-artifact.mjs record \
            "$RUNNER_TEMP/docs.tar.gz" "$RUNNER_TEMP/docs-manifest.json")"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"

      - name: Save docs for deployment retries
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-deployment-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/docs.tar.gz
            ${{ runner.temp }}/docs-manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build-and-deploy:
    name: Build and deploy docs
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout the same source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the lockfile-pinned deployment tool
        uses: santi020k/quality/actions/setup-pnpm@ff490e9efbd5fdfbdb1e6c404f1741d04c57f585 # v2.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore this run's built docs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ runner.temp }}/docs-deployment
          merge-multiple: true

      - name: Verify source approval and archive integrity before extraction
        env:
          EXPECTED_ARCHIVE_SHA256: ${{ needs.build.outputs.archive-sha256 }}
        run: |
          node scripts/check-approved-release-revision.mjs
          node .github/scripts/docs-deployment-artifact.mjs verify \
            "$RUNNER_TEMP/docs-deployment/docs.tar.gz" "$RUNNER_TEMP/docs-deployment/docs-manifest.json" "$EXPECTED_ARCHIVE_SHA256"
          mkdir -p "$DOCS_DIST_DIR"
          tar -xzf "$RUNNER_TEMP/docs-deployment/docs.tar.gz" -C "$DOCS_DIST_DIR"
          test -s "$DOCS_DIST_DIR/index.html"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          DEPLOY_BRANCH="${GITHUB_REF_NAME}"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            DEPLOY_BRANCH="$CLOUDFLARE_PAGES_PRODUCTION_BRANCH"
          fi

          pnpm exec wrangler pages deploy "$DOCS_DIST_DIR" --project-name="$CLOUDFLARE_PAGES_PROJECT_NAME" --branch="$DEPLOY_BRANCH"

      - name: Smoke test the public docs
        run: |
          for path in / /docs /starters/astro /downloads/lumen-astro-starter.zip; do
            curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
              --max-time 20 --output /dev/null "${PUBLIC_SITE_URL%/}$path"
          done
