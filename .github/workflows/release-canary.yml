name: Release candidate canaries

on:
  pull_request:
    paths:
      - ".github/workflows/release-canary.yml"
      - "Package.swift"
      - "apps/playground-android/**"
      - "apps/playground-apple/**"
      - "packages/**"
      - "registry/native-device-evidence.json"
      - "registry/native-stability-soak.json"
      - "registry/swift-api-baseline.json"
      - "registry/wear-api-classification.json"
      - "registry/release-manifest.json"
      - "scripts/check-swift-api-baseline.mjs"
      - "scripts/check-wear-api-classification.mjs"
      - "scripts/check-native-device-evidence.mjs"
      - "scripts/check-native-stability-soak.mjs"
      - "scripts/check-native-stable-readiness.mjs"
      - "scripts/generate-release-manifest.mjs"
      - "scripts/smoke-react-native-native-package.mjs"
      - "scripts/smoke-swift-package-candidate.mjs"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify release surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      compose: ${{ steps.paths.outputs.compose }}
      swift: ${{ steps.paths.outputs.swift }}
      web: ${{ steps.paths.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            printf 'web=true\nswift=true\ncompose=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          if grep -Eq '^(packages/(astro|core|elements|icons-brand|lumen|mcp|react|react-hook-form|react-native|templates|tokens)/|apps/(docs|next-smoke|playground-react-native|templates)/|registry/release-manifest\.json$|scripts/(generate-release-manifest|smoke-consumer-packages|smoke-react-native-native-package)\.mjs$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|turbo\.json$|\.github/workflows/release-canary\.yml$)' <<< "$changed_files"; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^(Package\.swift$|packages/(swift|tokens)/|apps/playground-apple/|tokens/|registry/(native-device-evidence|native-stability-soak|swift-api-baseline|release-manifest)\.json$|scripts/(check-native-device-evidence|check-native-stability-soak|check-native-stable-readiness|check-swift-api-baseline|generate-platform-tokens|generate-release-manifest|smoke-react-native-native-package|smoke-swift-package-candidate)\.mjs$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.github/workflows/release-canary\.yml$)' <<< "$changed_files"; then
            echo "swift=true" >> "$GITHUB_OUTPUT"
          else
            echo "swift=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -Eq '^(packages/(compose|tokens)/|apps/playground-android/|tokens/|registry/(native-device-evidence|native-stability-soak|wear-api-classification|release-manifest)\.json$|scripts/(check-native-device-evidence|check-native-stability-soak|check-native-stable-readiness|check-wear-api-classification|generate-platform-tokens|generate-release-manifest|smoke-react-native-native-package)\.mjs$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.github/workflows/release-canary\.yml$)' <<< "$changed_files"; then
            echo "compose=true" >> "$GITHUB_OUTPUT"
          else
            echo "compose=false" >> "$GITHUB_OUTPUT"
          fi

  web:
    name: Packed npm consumer
    needs: classify
    if: needs.classify.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.2.0
        with:
          cache: pnpm
          node-version: 22.x
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:release-manifest
      - run: pnpm run build
      - run: pnpm run check:consumer-packages
      - run: pnpm run check:react-native-package

  swift:
    name: Swift package consumer
    needs: classify
    if: needs.classify.outputs.swift == 'true'
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.2.0
        with:
          cache: pnpm
          node-version: 22.x
      - run: pnpm install --frozen-lockfile
      - run: swift test
      - run: swift package diagnose-api-breaking-changes v1.6.0 --products LumenUI
      - name: Check every target-specific Swift public API
        run: node scripts/check-swift-api-baseline.mjs
      - run: swift build --package-path apps/playground-apple
      - name: Resolve a clean consumer from a tagged Swift package candidate
        run: pnpm run check:swift-package-candidate
      - name: Build a native iOS consumer from the packed React Native package
        run: pnpm run check:react-native-native-package:ios

  compose:
    name: Compose source and app consumer
    needs: classify
    if: needs.classify.outputs.compose == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.2.0
        with:
          cache: pnpm
          node-version: 22.x
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install Android platform
        run: |
          android_sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          "$android_sdk_root/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" \
            "build-tools;36.0.0"
      - run: pnpm install --frozen-lockfile
      - run: ./gradlew test lint apiCheck verifyMavenPublication
        working-directory: packages/compose
      - run: node scripts/check-wear-api-classification.mjs
      - run: >-
          ./packages/compose/gradlew -p apps/playground-android
          -PlumenComposeRepository=../../packages/compose/build/central-staging
          assembleDebug :app:verifyLumenArtifactIsolation
      - name: Build a native Android consumer from the packed React Native package
        run: pnpm run check:react-native-native-package:android
