name: Release candidate canaries

on:
  pull_request:
    paths:
      - ".github/workflows/release-canary.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/publish-compose.yml"
      - ".github/workflows/verify-native-release.yml"
      - ".github/workflows/release-playground-apple.yml"
      - ".github/workflows/monitor-playground-apple.yml"
      - ".github/workflows/release-playground-macos.yml"
      - ".github/workflows/monitor-playground-macos.yml"
      - ".github/scripts/monitor-xcode-cloud.mjs"
      - ".github/scripts/monitor-xcode-cloud.test.mjs"
      - "Package.swift"
      - "apps/playground-android/**"
      - "apps/playground-apple/**"
      - "apps/playground-react-native/**"
      - "apps/docs/src/data/platforms.ts"
      - "docs/ai-usage.md"
      - "docs/native-compatibility.md"
      - "docs/native-components.md"
      - "docs/native-device-validation.md"
      - "docs/playgrounds.md"
      - "docs/web-consumer-validation.md"
      - "packages/**"
      - "registry/native-device-evidence.json"
      - "registry/native-consumer-evidence.json"
      - "registry/native-stability-soak.json"
      - "registry/native-api-baseline.json"
      - "registry/compose-api-classification.json"
      - "registry/lumen-2-contract.json"
      - "registry/web-api-baseline.json"
      - "registry/web-consumer-evidence.json"
      - "registry/swift-api-baseline.json"
      - "registry/swift-widget-api-baseline.json"
      - "registry/wear-api-classification.json"
      - "registry/release-manifest.json"
      - "scripts/check-swift-api-baseline.mjs"
      - "scripts/check-compose-api-classification.mjs"
      - "scripts/check-approved-release-revision.mjs"
      - "scripts/check-approved-release-revision.test.mjs"
      - "scripts/check-coordinated-release-revision.mjs"
      - "scripts/check-coordinated-release-revision.test.mjs"
      - "scripts/check-graduated-release-revision.mjs"
      - "scripts/check-graduated-release-revision.test.mjs"
      - "scripts/check-wear-api-classification.mjs"
      - "scripts/check-native-device-evidence.mjs"
      - "scripts/check-native-device-evidence.test.mjs"
      - "scripts/check-native-consumer-evidence.mjs"
      - "scripts/check-native-consumer-evidence.test.mjs"
      - "scripts/check-native-stability-soak.mjs"
      - "scripts/check-native-stability-soak.test.mjs"
      - "scripts/check-native-api-baseline.mjs"
      - "scripts/check-native-stable-readiness.mjs"
      - "scripts/check-native-stable-readiness.test.mjs"
      - "scripts/check-lumen-2-contract.mjs"
      - "scripts/check-lumen-2-contract.test.mjs"
      - "scripts/check-maven-release-artifacts.mjs"
      - "scripts/check-maven-release-artifacts.test.mjs"
      - "scripts/check-maven-pom-metadata.mjs"
      - "scripts/check-maven-pom-metadata.test.mjs"
      - "scripts/maven-pom-metadata.mjs"
      - "scripts/check-npm-release-provenance.mjs"
      - "scripts/check-npm-release-provenance.test.mjs"
      - "scripts/check-published-package-family.mjs"
      - "scripts/check-published-package-family.test.mjs"
      - "scripts/check-v2-release-workflows.test.mjs"
      - "scripts/check-web-api-baseline.mjs"
      - "scripts/check-web-api-baseline.test.mjs"
      - "scripts/check-web-consumer-evidence.mjs"
      - "scripts/check-web-consumer-evidence.test.mjs"
      - "scripts/check-playground-eas-version.mjs"
      - "scripts/check-playground-eas-version.test.mjs"
      - "scripts/check-playground-apple-release.mjs"
      - "scripts/check-playground-apple-release.test.mjs"
      - "scripts/check-react-native-peer-docs.mjs"
      - "scripts/check-react-native-peer-docs.test.mjs"
      - "scripts/generate-release-manifest.mjs"
      - "scripts/generate-release-manifest.test.mjs"
      - "scripts/sync-swift-version.mjs"
      - "scripts/sync-swift-version.test.mjs"
      - "scripts/sync-coordinated-v2-versions.mjs"
      - "scripts/sync-coordinated-v2-versions.test.mjs"
      - "scripts/smoke-react-native-native-package.mjs"
      - "scripts/smoke-swift-package-candidate.mjs"
      - "scripts/classify-workflow-paths.mjs"
      - "scripts/classify-workflow-paths.test.mjs"
      - "scripts/release-scope.mjs"
      - "scripts/release-scope.test.mjs"
      - "scripts/publish-packages.mjs"
      - "scripts/workflow-scope.test.mjs"
      - "scripts/version-packages.mjs"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify release surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      browser: ${{ steps.paths.outputs.browser }}
      compose: ${{ steps.paths.outputs.compose }}
      consumer-packages: ${{ steps.paths.outputs.consumer-packages }}
      native: ${{ steps.paths.outputs.native }}
      npm-packages: ${{ steps.paths.outputs.npm-packages }}
      react-native: ${{ steps.paths.outputs.react-native }}
      swift: ${{ steps.paths.outputs.swift }}
      web: ${{ steps.paths.outputs.web }}
      web-contracts: ${{ steps.paths.outputs.web-contracts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          node scripts/classify-workflow-paths.mjs canary
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --output "$GITHUB_OUTPUT"

  web:
    name: Packed npm consumer
    needs: classify
    if: needs.classify.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LUMEN_RELEASE_PACKAGES: ${{ needs.classify.outputs.npm-packages }}
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
      TURBO_SCM_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.2.0
        with:
          cache: pnpm
          node-version: 22.x
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:release-manifest
      - run: node --test scripts/generate-release-manifest.test.mjs
      - run: pnpm run check:web-api-baseline && pnpm run test:web-api-baseline
        if: needs.classify.outputs.web-contracts == 'true'
      - run: pnpm run check:web-consumer-evidence && pnpm run test:web-consumer-evidence
        if: needs.classify.outputs.web-contracts == 'true'
      - name: Enforce the Lumen 2 contract
        if: needs.classify.outputs.web-contracts == 'true' || needs.classify.outputs.native == 'true'
        run: >-
          pnpm run check:lumen-2-contract &&
          pnpm run test:lumen-2-contract
      - name: Enforce coordinated native release gates
        if: needs.classify.outputs.native == 'true'
        run: >-
          pnpm run check:native-stability-soak &&
          pnpm run test:native-stability-soak &&
          pnpm run check:native-consumer-evidence &&
          pnpm run test:native-consumer-evidence &&
          pnpm run check:native-device-evidence &&
          pnpm run test:native-device-evidence &&
          pnpm run test:native-stable-readiness &&
          pnpm run test:approved-release-revision &&
          pnpm run test:coordinated-release-revision &&
          pnpm run check:graduated-release-revision &&
          pnpm run test:graduated-release-revision &&
          pnpm run test:maven-release-artifacts &&
          pnpm run test:npm-release-provenance &&
          pnpm run test:published-package-family &&
          pnpm run test:v2-release-workflows
      - run: pnpm run check:playground-eas-version && pnpm run test:playground-eas-version
        if: needs.classify.outputs.react-native == 'true'
      - run: pnpm run check:react-native-peer-docs && pnpm run test:react-native-peer-docs
        if: needs.classify.outputs.react-native == 'true'
      - name: Build the selected release packages
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            pnpm run build
          else
            pnpm run build:release-scope
          fi
      - name: Install the release-candidate browser
        if: needs.classify.outputs.browser == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify release-candidate accessibility
        if: needs.classify.outputs.browser == 'true'
        run: pnpm run test:a11y
      - name: Verify release-candidate framework behavior
        if: needs.classify.outputs.browser == 'true'
        env:
          LUMEN_FRAMEWORK_CONFORMANCE_PROJECTS: chromium
        run: pnpm run test:framework-conformance
      - run: pnpm run check:consumer-packages
        if: needs.classify.outputs.consumer-packages == 'true'
      - run: pnpm run check:react-native-package
        if: needs.classify.outputs.react-native == 'true'

  swift:
    name: Swift package consumer
    needs: classify
    if: needs.classify.outputs.swift == 'true'
    runs-on: macos-26
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.2.0
        with:
          cache: pnpm
          node-version: 22.x
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:playground-apple-release && pnpm run test:playground-apple-release
      - run: pnpm run check:swift-version && pnpm run test:swift-version
      - run: swift test
      - run: pnpm run check:swift-source-compatibility
      - name: Check every target-specific Swift public API
        run: pnpm run check:swift-api-baseline
      - run: swift build --package-path apps/playground-apple
      - name: Resolve a clean consumer from a tagged Swift package candidate
        run: pnpm run check:swift-package-candidate
      - name: Build a native iOS consumer from the packed React Native package
        run: pnpm run check:react-native-native-package:ios

  compose:
    name: Compose source and app consumer
    needs: classify
    if: needs.classify.outputs.compose == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.2.0
        with:
          cache: pnpm
          node-version: 22.x
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
      - name: Install Android platform
        run: |
          android_sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          "$android_sdk_root/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" \
            "build-tools;36.0.0"
      - run: pnpm install --frozen-lockfile
      - run: ./gradlew test lint apiCheck verifyMavenPublication
        working-directory: packages/compose
      - run: pnpm run check:compose-api-classification && pnpm run test:compose-api-classification
      - run: node scripts/check-wear-api-classification.mjs
      - run: pnpm run check:native-consumer-evidence && pnpm run test:native-consumer-evidence
      - run: >-
          ./packages/compose/gradlew -p apps/playground-android
          -PlumenComposeRepository=../../packages/compose/build/central-staging
          assembleDebug :app:verifyLumenArtifactIsolation
      - name: Build a native Android consumer from the packed React Native package
        run: pnpm run check:react-native-native-package:android
