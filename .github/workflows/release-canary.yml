name: Release candidate canaries

on:
  pull_request:
    paths:
      - ".github/workflows/release-canary.yml"
      - "Package.swift"
      - "apps/playground-android/**"
      - "apps/playground-apple/**"
      - "packages/**"
      - "registry/release-manifest.json"
      - "scripts/generate-release-manifest.mjs"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Packed npm consumer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.2.0
        with:
          cache: pnpm
          node-version: 22.x
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:release-manifest
      - run: pnpm run build
      - run: pnpm run check:consumer-packages

  swift:
    name: Swift package consumer
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift test
      - run: swift build --package-path apps/playground-apple

  compose:
    name: Compose source and app consumer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install Android platform
        run: |
          android_sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          "$android_sdk_root/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" \
            "build-tools;36.0.0"
      - run: ./gradlew test lint verifyMavenPublication
        working-directory: packages/compose
      - run: ./packages/compose/gradlew -p apps/playground-android assembleDebug
