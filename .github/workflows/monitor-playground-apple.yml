name: Check Apple playground release status

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing iOS release tag, for example playground-ios-v1.0.0-r42
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  monitor:
    name: Monitor Xcode Cloud release
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    environment:
      name: app-store
      url: https://appstoreconnect.apple.com/apps/6805250815
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^playground-ios-v[0-9]+\.[0-9]+(\.[0-9]+)?-r[1-9][0-9]*$ ]]; then
            echo "::error title=Invalid tag::Use an iOS release tag such as playground-ios-v1.0.0-r42."
            exit 1
          fi
          if ! git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG^{commit}" >/dev/null; then
            echo "::error title=Unknown tag::$RELEASE_TAG does not exist in this repository."
            exit 1
          fi

          echo "commit_sha=$(git rev-list -n 1 "$RELEASE_TAG")" >> "$GITHUB_OUTPUT"

      - name: Fetch Apple release-monitoring secrets from Infisical
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          secret-path: /playground/apple

      - name: Wait for Xcode Cloud
        env:
          XCODE_CLOUD_PRODUCT_ID: ${{ vars.XCODE_CLOUD_PRODUCT_ID }}
          XCODE_CLOUD_WORKFLOW_NAME: App Store Release
          SOURCE_COMMIT_SHA: ${{ steps.release.outputs.commit_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: APP_STORE_CONNECT_PRIVATE_KEY="$APP_STORE_CONNECT_API_KEY_P8" node .github/scripts/monitor-xcode-cloud.mjs
