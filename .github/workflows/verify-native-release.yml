name: Verify published native release

run-name: >-
  Verify RN ${{ inputs.react-native-version }}, Swift ${{ inputs.swift-version }},
  Compose ${{ inputs.compose-version }}

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full Git revision shared by the immutable native release tags
        required: true
        type: string
      react-native-version:
        description: Exact published @santi020k/lumen-react-native version
        required: true
        type: string
      swift-version:
        description: Exact published Swift repository version without the v prefix
        required: true
        type: string
      compose-version:
        description: Exact published Compose and Wear Maven version
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: verify-native-release-${{ inputs.revision }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Resolve immutable public artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.2.0
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org

      - name: Match versions, tags, registries, and revision
        env:
          COMPOSE_VERSION: ${{ inputs.compose-version }}
          EXPECTED_REVISION: ${{ inputs.revision }}
          REACT_NATIVE_VERSION: ${{ inputs.react-native-version }}
          SWIFT_VERSION: ${{ inputs.swift-version }}
        run: |
          semantic_version='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          for candidate in "$REACT_NATIVE_VERSION" "$SWIFT_VERSION" "$COMPOSE_VERSION"; do
            if [[ ! "$candidate" =~ $semantic_version ]]; then
              echo "Invalid semantic version: $candidate" >&2
              exit 1
            fi
          done

          if [[ ! "$EXPECTED_REVISION" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "revision must be a full 40-character Git revision" >&2
            exit 1
          fi

          manifest_react_native="$(node -p "require('./packages/react-native/package.json').version")"
          manifest_swift="$(node -p "require('./packages/lumen/package.json').version")"
          manifest_compose="$(sed -n 's/^lumenComposeVersion=//p' packages/compose/gradle.properties)"

          [[ "$manifest_react_native" == "$REACT_NATIVE_VERSION" ]]
          [[ "$manifest_swift" == "$SWIFT_VERSION" ]]
          [[ "$manifest_compose" == "$COMPOSE_VERSION" ]]

          resolve_tag_revision() {
            local tag="$1"
            local refs
            local resolved

            refs="$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")"
            resolved="$(awk -v peeled="refs/tags/$tag^{}" '$2 == peeled { print $1 }' <<< "$refs")"
            if [[ -z "$resolved" ]]; then
              resolved="$(awk -v direct="refs/tags/$tag" '$2 == direct { print $1 }' <<< "$refs")"
            fi
            if [[ -z "$resolved" ]]; then
              echo "Could not resolve immutable tag $tag" >&2
              exit 1
            fi
            printf '%s' "$resolved"
          }

          swift_revision="$(resolve_tag_revision "v$SWIFT_VERSION")"
          compose_revision="$(resolve_tag_revision "compose-v$COMPOSE_VERSION")"

          [[ "$swift_revision" == "$EXPECTED_REVISION" ]]
          [[ "$compose_revision" == "$EXPECTED_REVISION" ]]

          registry_react_native="$(npm view \
            "@santi020k/lumen-react-native@$REACT_NATIVE_VERSION" version)"
          [[ "$registry_react_native" == "$REACT_NATIVE_VERSION" ]]

          node scripts/check-maven-release-artifacts.mjs \
            --version "$COMPOSE_VERSION"

          {
            echo "Verifier tooling \`$(git rev-parse HEAD)\` confirmed all native release coordinates resolve from revision \`$EXPECTED_REVISION\`."
            echo
            echo "- React Native: \`$REACT_NATIVE_VERSION\`"
            echo "- Swift: \`v$SWIFT_VERSION\`"
            echo "- Compose and Wear: \`$COMPOSE_VERSION\`"
          } >> "$GITHUB_STEP_SUMMARY"

  react-native-android:
    name: Published React Native Android consumer
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.2.0
        with:
          cache: pnpm
          node-version: 22.x
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
      - name: Install Android platform
        run: |
          android_sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          "$android_sdk_root/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" \
            "build-tools;36.0.0"
      - run: pnpm install --frozen-lockfile
      - name: Build the exact public npm artifact for Android
        env:
          EXPECTED_REVISION: ${{ inputs.revision }}
          REACT_NATIVE_VERSION: ${{ inputs.react-native-version }}
        run: >-
          pnpm run check:react-native-native-release:android --
          --version "$REACT_NATIVE_VERSION"
          --revision "$EXPECTED_REVISION"

  react-native-ios:
    name: Published React Native iOS consumer
    needs: metadata
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.2.0
        with:
          cache: pnpm
          node-version: 22.x
      - run: pnpm install --frozen-lockfile
      - name: Require CocoaPods
        run: pod --version
      - name: Build the exact public npm artifact for iOS
        env:
          EXPECTED_REVISION: ${{ inputs.revision }}
          REACT_NATIVE_VERSION: ${{ inputs.react-native-version }}
        run: >-
          pnpm run check:react-native-native-release:ios --
          --version "$REACT_NATIVE_VERSION"
          --revision "$EXPECTED_REVISION"

  swift:
    name: Published Swift package consumers
    needs: metadata
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build every platform from the exact public tag
        env:
          SWIFT_VERSION: ${{ inputs.swift-version }}
        run: >-
          node scripts/smoke-swift-package-candidate.mjs
          --url https://github.com/santi020k/lumen
          --version "$SWIFT_VERSION"

  compose:
    name: Published Compose and Wear consumers
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
      - name: Install Android platform
        run: |
          android_sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          "$android_sdk_root/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" \
            "build-tools;36.0.0"
      - name: Build exact Maven Central phone and watch artifacts
        env:
          COMPOSE_VERSION: ${{ inputs.compose-version }}
        run: >-
          ./packages/compose/gradlew -p apps/playground-android
          -PlumenComposeRepository=https://repo.maven.apache.org/maven2
          -PlumenComposeVersion="$COMPOSE_VERSION"
          clean lint assembleDebug
          :app:verifyLumenArtifactIsolation
          :wear:verifyLumenArtifactVersions
